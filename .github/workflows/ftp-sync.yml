name: Sync site from hosting

# weget.site 静态页自动同步（GitHub 仓库只保存静态资源，PHP 永不入库）
#
# 流程：定时通过 FTP 从虚拟主机拉取 dist/（后台「生成静态页」的产物）→
#       静态白名单过滤 → 三道安全阀 → 有变化才提交到仓库根 →
#       GitHub Pages 以 GitHub Actions 模式发布（自定义域名见 CNAME）。
#
# 使用前提（仓库 Settings）：
#   1. Secrets：FTP_HOST / FTP_USER / FTP_PASS / FTP_DIR（指向主机 dist/ 目录）
#   2. Actions → General → Workflow permissions → Read and write permissions
#   3. Pages → Source = GitHub Actions

on:
  schedule:
    - cron: "9 * * * *"    # 每小时第 9 分（UTC）。三站错峰:weget 9 分 / soft 29 分 / bizhi 49 分,任意时刻仅一站拉取主机 FTP
  workflow_dispatch: {}       # 允许在 Actions 页手动触发

concurrency:
  group: ftp-sync
  cancel-in-progress: false

permissions:
  contents: write             # 同步提交需要（deploy 任务在任务内单独声明）

env:
  FTP_HOST: ${{ secrets.FTP_HOST }}
  FTP_DIR: ${{ secrets.FTP_DIR }}   # ★ 指向主机上的 dist/ 目录，不是站点根目录
  # ★ 铁律：FTP 镜像必须放在 runner 临时目录，绝不能放在仓库内部
  #   （放仓库内部会被 rsync --delete 当作"仓库多余内容"删掉）
  MIRROR: /tmp/ftpmirror

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5   # v4 会报 Node 20 弃用警告

      - name: Pull site from hosting (FTP mirror)
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp   # ubuntu-latest 不预装 lftp
          rm -rf "$MIRROR" && mkdir -p "$MIRROR"
          set -o pipefail
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF | tee /tmp/ftp.log
          set net:max-retries 2
          set net:timeout 30
          set ftp:ssl-allow no
          # 限速避免触发主机防护；串行避免触发主机 FTP 连接数限制（两者都是真实踩过的坑）
          set net:limit-rate 2097152
          # 不用 --delete、不用 --parallel：防主机目录列表错乱导致误删文件
          mirror --no-perms --verbose=1 "$FTP_DIR" "$MIRROR"
          bye
          EOF
          echo "下载完成，镜像文件数: $(find "$MIRROR" -type f | wc -l)"

      # 失败时把诊断信息（不含密码）打印到运行页顶部 Summary
      - name: Diagnose FTP failure
        if: failure()
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
        run: |
          {
            echo "## 同步失败诊断"
            echo "- FTP_HOST=\`$FTP_HOST\`  FTP_DIR=\`$FTP_DIR\`  FTP_USER=\`$FTP_USER\`"
            echo "- 磁盘剩余：$(df -h /home/runner/work | tail -1)"
            echo "- 镜像文件数：$(find "$MIRROR" -type f 2>/dev/null | wc -l)"
            echo "- 拉取日志关键行："
            echo '```'
            grep -iaE '530|login|550|421|425|timed? ?out|not found|failed|error|refused|denied|ssl|tls' /tmp/ftp.log | tail -20 || echo "(无匹配)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 安全阀 1：拉取为空 = FTP 路径/账号错，绝不能继续（否则会把仓库清空推上去）
      - name: Verify mirror is not empty
        run: |
          if [ -z "$(ls -A "$MIRROR")" ]; then
            echo "::error::FTP 拉取结果为空：请检查 Secrets（尤其确认 FTP_DIR 指向主机 dist/ 目录）"
            exit 1
          fi
          echo "拉取文件数: $(find "$MIRROR" -type f | wc -l)"

      # 白名单：只放行静态扩展名；php/配置/备份一律挡住——即使 FTP_DIR 配错成站点
      # 根目录，PHP 文件也进不了仓库。仓库公开 = 全世界可见，宁可少同步。
      - name: Sync into repo (static whitelist only)
        run: |
          rc=0
          for i in 1 2 3; do
            if rsync -a --delete \
              --exclude='admin' \
              --exclude='.git/' --exclude='.github/' \
              --exclude='CNAME' --exclude='*.md' \
              --include='*/' \
              --include='*.html' --include='*.htm' --include='*.shtml' \
              --include='*.css' --include='*.js' --include='*.mjs' --include='*.map' \
              --include='*.json' --include='*.xml' --include='*.txt' \
              --include='*.jpg' --include='*.jpeg' --include='*.png' --include='*.gif' \
              --include='*.webp' --include='*.svg' --include='*.ico' --include='*.bmp' --include='*.avif' \
              --include='*.woff' --include='*.woff2' --include='*.ttf' --include='*.otf' --include='*.eot' \
              --include='*.mp4' --include='*.webm' --include='*.mp3' --include='*.ogg' --include='*.wav' --include='*.m4a' \
              --include='*.pdf' --include='*.csv' \
              --exclude='*' \
              "$MIRROR/" ./
            then rc=0; break; fi
            rc=$?
            if [ "$rc" -ne 24 ]; then break; fi   # 24=个别文件消失，重试兜底
            echo "第 $i 次 rsync 出现文件 vanished（code 24），重试..."
          done
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 24 ]; then exit "$rc"; fi
          # 安全阀 2：仓库必须存在站点首页，否则视为远程异常
          test -f index.html || { echo "::error::同步后仓库中没有 index.html，已中止提交"; exit 1; }
          # 安全阀 3：模型详情页数量 镜像=仓库，防止不完整内容被提交
          a=$(find "$MIRROR/model" -name '*.html' | wc -l)
          b=$(find model -name '*.html' | wc -l)
          [ "$a" = "$b" ] || { echo "::error::模型页数量不一致（镜像 $a vs 仓库 $b）"; exit 1; }
          # 铁律复查：同步后仓库里绝不允许出现 PHP 文件
          if find . -path ./.git -prune -o -name '*.php' -print -quit | grep -q .; then
            echo "::error::同步结果中出现 .php 文件，已中止提交"; exit 1
          fi

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "网站内容与仓库一致，本次无需更新"
          else
            git commit -m "sync: 自动同步虚拟主机网站内容 $(TZ=Asia/Shanghai date +'%F %T')"
            git push
          fi

  # Pages 发布：GitHub Actions 模式，直接发布仓库根的静态内容
  deploy:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Upload site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
