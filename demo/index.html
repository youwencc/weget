  }
  ctx.globalAlpha = 1;
  setLight(false);
}
function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  setLight(true);
  glow(0, 0, e.r, e.color, 0.20, 1.7);
  setLight(false);
  const flashOn = e.flash > 0;
  const bodyFill = flashOn ? '#ffffff' : 'rgba(9,18,38,0.92)';
  const edge = flashOn ? '#ffffff' : e.color;
  ctx.strokeStyle = edge;
  ctx.lineWidth = 3;
  ctx.beginPath();
  switch (e.type) {
    case 'straight':
      ctx.moveTo(0, e.r*1.1); ctx.lineTo(-e.r*0.9, -e.r*0.55); ctx.lineTo(-e.r*0.35, -e.r*0.85);
      ctx.lineTo(0, -e.r*0.25); ctx.lineTo(e.r*0.35, -e.r*0.85); ctx.lineTo(e.r*0.9, -e.r*0.55);
      break;
    case 'sine':
      ctx.moveTo(0, e.r*1.05); ctx.lineTo(e.r*0.85, 0); ctx.lineTo(0, -e.r*1.05); ctx.lineTo(-e.r*0.85, 0);
      break;
    case 'dive':
      ctx.moveTo(0, e.r*1.3); ctx.lineTo(-e.r*0.95, -e.r*0.85); ctx.lineTo(-e.r*0.3, -e.r*0.45);
      ctx.lineTo(0, -e.r*0.95); ctx.lineTo(e.r*0.3, -e.r*0.45); ctx.lineTo(e.r*0.95, -e.r*0.85);
      break;
    case 'kamikaze':
      ctx.moveTo(0, e.r*1.15); ctx.lineTo(-e.r*0.7, -e.r*0.7); ctx.lineTo(0, -e.r*0.3); ctx.lineTo(e.r*0.7, -e.r*0.7);
      break;
    case 'weaver':
      ctx.moveTo(0, e.r*1.2); ctx.lineTo(-e.r*0.7, 0); ctx.lineTo(0, -e.r*1.0); ctx.lineTo(e.r*0.7, 0);
      break;
    case 'sniper':
      ctx.moveTo(0, e.r*1.25); ctx.lineTo(-e.r*0.55, e.r*0.3); ctx.lineTo(-e.r*0.9, -e.r*0.9);
      ctx.lineTo(0, -e.r*0.4); ctx.lineTo(e.r*0.9, -e.r*0.9); ctx.lineTo(e.r*0.55, e.r*0.3);
      break;
    case 'guardian':
      for (let i = 0; i < 5; i++) {
        const a = i*TAU/5-Math.PI/2;
        const px = Math.cos(a)*e.r, py = Math.sin(a)*e.r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      break;
    case 'phantom':
      ctx.moveTo(-e.r*0.9, -e.r*0.2);
      ctx.arc(0, -e.r*0.2, e.r*0.9, Math.PI, 0);
      ctx.lineTo(e.r*0.9, e.r*0.45);
      ctx.lineTo(e.r*0.45, e.r*0.25);
      ctx.lineTo(0, e.r*0.5);
      ctx.lineTo(-e.r*0.45, e.r*0.25);
      ctx.lineTo(-e.r*0.9, e.r*0.45);
      break;
    case 'turret':
      for (let i = 0; i < 6; i++) {
        const a = i*TAU/6-Math.PI/2;
        const px = Math.cos(a)*e.r, py = Math.sin(a)*e.r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      break;
    case 'spinner':
      for (let i = 0; i < 8; i++) {
        const a = i*TAU/8-Math.PI/2;
        const rr = i%2 === 0 ? e.r : e.r*0.5;
        const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      break;
    case 'bomber':
      ctx.moveTo(0, e.r); ctx.lineTo(-e.r*1.1, 0); ctx.lineTo(0, -e.r*0.7); ctx.lineTo(e.r*1.1, 0);
      break;
    case 'splitter':
    case 'orbiter':
      ctx.arc(0, 0, e.r, 0, TAU);
      break;
    case 'elite':
      for (let i = 0; i < 6; i++) {
        const a = i*TAU/6-Math.PI/2;
        const px = Math.cos(a)*e.r, py = Math.sin(a)*e.r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      break;
  }
  ctx.closePath();
  ctx.fillStyle = bodyFill;
  ctx.fill(); ctx.stroke();

  if (e.type === 'splitter') {
    ctx.strokeStyle = edge;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-e.r*0.6, 0); ctx.lineTo(e.r*0.6, 0);
    ctx.moveTo(0, -e.r*0.6); ctx.lineTo(0, e.r*0.6);
    ctx.stroke();
  } else if (e.type === 'turret') {
    ctx.save();
    ctx.rotate(e.t*2);
    ctx.strokeStyle = edge; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, e.r*0.85, 0, Math.PI*1.4); ctx.stroke();
    ctx.restore();
    // 炮口蓄力
    if (e.chargeFx > 0) {
      ctx.fillStyle = `rgba(255,138,61,${e.chargeFx})`;
      ctx.beginPath(); ctx.arc(0, e.r*0.8, 3+e.chargeFx*6, 0, TAU); ctx.fill();
    }
  } else if (e.type === 'orbiter') {
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, e.r*1.35, 0, TAU); ctx.stroke();
  } else if (e.type === 'bomber') {
    ctx.fillStyle = edge;
    ctx.beginPath(); ctx.arc(0, e.r*0.15, 5, 0, TAU); ctx.fill();
  }

  setLight(true);
  const coreR = (e.type === 'elite' ? e.r*0.32 : e.r*0.30)*(1+Math.sin(e.t*7)*0.12);
  glow(0, 0, coreR, e.core, 0.75, 1.7);
  ctx.fillStyle = flashOn ? '#ffffff' : e.core;
  ctx.beginPath(); ctx.arc(0, 0, coreR*0.55, 0, TAU); ctx.fill();
  setLight(false);

  if (e.type === 'kamikaze' && e.chargeTimer < 0.7) {
    const k = e.chargeTimer/0.7;
    ctx.strokeStyle = `rgba(255,94,122,${0.4+k*0.6})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, e.r+6+k*10, 0, TAU); ctx.stroke();
  }

  // 蓄力提示
  if (e.chargeFx > 0) {
    ctx.strokeStyle = `rgba(255,255,255,${e.chargeFx*0.7})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, e.r + 4 + e.chargeFx*8, 0, TAU);
    ctx.stroke();
  }

  if (e.type === 'elite') {
    const w = 80, h = 7;
    const y = -e.r-20;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    roundRect(-w/2, y, w, h, 3.5); ctx.fill();
    const g = ctx.createLinearGradient(-w/2, 0, w/2, 0);
    g.addColorStop(0, '#ff8a3d'); g.addColorStop(1, '#ffd166');
    ctx.fillStyle = g;
    roundRect(-w/2, y, w*(e.hp/e.maxHp), h, 3.5); ctx.fill();
  }
  ctx.restore();
}

/* ============================================================
   Boss 三种风格视觉
   ============================================================ */
function drawBossBody() {
  if (!boss) return;
  const b = boss;
  const style = b.style || BOSS_STYLES[0];
  ctx.save();
  ctx.translate(b.x, b.y);

  setLight(true);
  glow(0, 0, b.r*1.15, style.main, 0.28, 1.7);
  setLight(false);

  if (b.shape === 1) drawBossRing(b, style);
  else if (b.shape === 2) drawBossChaos(b, style);
  else drawBossClassic(b, style);

  ctx.restore();
}

function drawBossClassic(b, style) {
  // 外层旋转环
  ctx.save();
  ctx.rotate(b.t*0.65);
  ctx.strokeStyle = hexA(style.main, 0.42);
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = i*TAU/8;
    const rr = b.r*1.42;
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.stroke();
  ctx.restore();

  // 两侧炮台
  for (const sx of [-1, 1]) {
    ctx.save();
    ctx.translate(sx * b.r * 0.85, b.r * 0.15);
    ctx.fillStyle = 'rgba(60,20,35,0.95)';
    ctx.strokeStyle = style.main;
    ctx.lineWidth = 2.5;
    roundRect(-14, -20, 28, 40, 6);
    ctx.fill(); ctx.stroke();
    // 炮口
    ctx.fillStyle = style.accent;
    ctx.beginPath(); ctx.arc(0, -20, 5, 0, TAU); ctx.fill();
    if (b.chargeFx > 0) {
      setLight(true);
      glow(0, -20, 12, style.accent, b.chargeFx*0.8, 1.6);
      setLight(false);
    }
    ctx.restore();
  }

  // 六边形主体
  const bodyGrad = ctx.createLinearGradient(0, -b.r, 0, b.r);
  if (b.flash > 0) { bodyGrad.addColorStop(0, '#ffffff'); bodyGrad.addColorStop(1, '#ffd0a0'); }
  else { bodyGrad.addColorStop(0, style.dark); bodyGrad.addColorStop(0.5, hexA(style.dark, 0.55)); bodyGrad.addColorStop(1, 'rgba(6,4,10,0.92)'); }
  ctx.fillStyle = bodyGrad;
  ctx.strokeStyle = b.flash > 0 ? '#ffffff' : style.main;
  ctx.lineWidth = 5;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = i*TAU/6-Math.PI/2;
    const px = Math.cos(a)*b.r, py = Math.sin(a)*b.r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // 装甲纹路
  ctx.strokeStyle = hexA(style.accent, 0.3);
  ctx.lineWidth = 2;
  for (let i = 0; i < 3; i++) {
    const a = i*TAU/3 + Math.PI/6;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*b.r*0.4, Math.sin(a)*b.r*0.4);
    ctx.lineTo(Math.cos(a)*b.r*0.85, Math.sin(a)*b.r*0.85);
    ctx.stroke();
  }

  // 核心
  const coreR = b.r*0.34+Math.sin(b.t*7)*4;
  setLight(true);
  glow(0, 0, coreR, b.phase === 3 ? '#ff5e7a' : style.accent, 0.55+b.coreGlow*0.25, 2.2);
  setLight(false);
  const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, coreR);
  cg.addColorStop(0, '#ffffff');
  cg.addColorStop(0.5, b.phase === 3 ? '#ff8a9c' : hexA(style.accent, 0.9));
  cg.addColorStop(1, b.phase === 3 ? '#c81f45' : hexA(style.dark, 1));
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(0, 0, coreR, 0, TAU); ctx.fill();
}

function drawBossRing(b, style) {
  // 三层旋转环
  const rings = [
    { speed: 0.5, radius: 1.55, width: 3, dots: 12, color: hexA(style.main, 0.35) },
    { speed: -0.8, radius: 1.25, width: 2, dots: 8, color: hexA(style.accent, 0.45) },
    { speed: 1.1, radius: 1.05, width: 1.5, dots: 6, color: 'rgba(255,255,255,0.3)' }
  ];
  for (const ring of rings) {
    ctx.save();
    ctx.rotate(b.t * ring.speed);
    ctx.strokeStyle = ring.color;
    ctx.lineWidth = ring.width;
    ctx.beginPath();
    ctx.arc(0, 0, b.r * ring.radius, 0, TAU);
    ctx.stroke();
    // 环上的光点
    for (let i = 0; i < ring.dots; i++) {
      const a = i * TAU / ring.dots;
      const x = Math.cos(a) * b.r * ring.radius;
      const y = Math.sin(a) * b.r * ring.radius;
      setLight(true);
      glow(x, y, 6, style.main, 0.6, 1.6);
      setLight(false);
    }
    ctx.restore();
  }

  // 卫星球（8 个）
  for (let i = 0; i < 8; i++) {
    const a = b.t * 1.3 + i * TAU / 8;
    const sr = b.r * 1.7;
    const sx = Math.cos(a) * sr;
    const sy = Math.sin(a) * sr;
    setLight(true);
    glow(sx, sy, 10, style.accent, 0.55, 1.5);
    setLight(false);
    ctx.fillStyle = style.accent;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(sx, sy, 7, 0, TAU);
    ctx.fill(); ctx.stroke();
  }

  // 圆形主体
  const bodyGrad = ctx.createRadialGradient(0, -b.r*0.3, 0, 0, 0, b.r);
  if (b.flash > 0) { bodyGrad.addColorStop(0, '#ffffff'); bodyGrad.addColorStop(1, '#c8f4ff'); }
  else {
    bodyGrad.addColorStop(0, style.dark);
    bodyGrad.addColorStop(0.6, hexA(style.dark, 0.75));
    bodyGrad.addColorStop(1, 'rgba(2,6,14,0.92)');
  }
  ctx.fillStyle = bodyGrad;
  ctx.strokeStyle = b.flash > 0 ? '#ffffff' : style.main;
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.arc(0, 0, b.r, 0, TAU);
  ctx.fill(); ctx.stroke();

  // 内部刻度
  ctx.strokeStyle = hexA(style.main, 0.4);
  ctx.lineWidth = 2;
  for (let i = 0; i < 12; i++) {
    const a = i * TAU / 12 + b.t * 0.3;
    const r1 = b.r * 0.78;
    const r2 = b.r * 0.88;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*r1, Math.sin(a)*r1);
    ctx.lineTo(Math.cos(a)*r2, Math.sin(a)*r2);
    ctx.stroke();
  }

  // 核心
  const coreR = b.r*0.30+Math.sin(b.t*7)*4;
  setLight(true);
  glow(0, 0, coreR, b.phase === 3 ? '#ff5e7a' : style.accent, 0.7+b.coreGlow*0.25, 2.4);
  setLight(false);
  const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, coreR);
  cg.addColorStop(0, '#ffffff');
  cg.addColorStop(0.5, b.phase === 3 ? '#ff8a9c' : hexA(style.accent, 0.9));
  cg.addColorStop(1, b.phase === 3 ? '#c81f45' : hexA(style.dark, 1));
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(0, 0, coreR, 0, TAU); ctx.fill();

  // 蓄力光
  if (b.chargeFx > 0) {
    setLight(true);
    glow(0, 0, b.r*0.6, style.accent, b.chargeFx*0.5, 1.8);
    setLight(false);
  }
}

function drawBossChaos(b, style) {
  // 外围旋转碎片
  for (let i = 0; i < 6; i++) {
    const a = b.t * 0.9 + i * TAU / 6;
    const dr = b.r * 1.5;
    const dx = Math.cos(a) * dr;
    const dy = Math.sin(a) * dr;
    ctx.save();
    ctx.translate(dx, dy);
    ctx.rotate(a * 2 + b.t);
    ctx.fillStyle = hexA(style.dark, 0.9);
    ctx.strokeStyle = style.main;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -10);
    ctx.lineTo(8, 5);
    ctx.lineTo(-6, 8);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // 不规则八边形主体（旋转+抖动）
  ctx.save();
  ctx.rotate(Math.sin(b.t * 0.8) * 0.15);
  const bodyGrad = ctx.createLinearGradient(0, -b.r, 0, b.r);
  if (b.flash > 0) { bodyGrad.addColorStop(0, '#ffffff'); bodyGrad.addColorStop(1, '#ffc0c8'); }
  else {
    bodyGrad.addColorStop(0, style.dark);
    bodyGrad.addColorStop(0.5, hexA(style.dark, 0.6));
    bodyGrad.addColorStop(1, 'rgba(3,2,8,0.92)');
  }
  ctx.fillStyle = bodyGrad;
  ctx.strokeStyle = b.flash > 0 ? '#ffffff' : style.main;
  ctx.lineWidth = 5;
  ctx.beginPath();
  const verts = 8;
  for (let i = 0; i < verts; i++) {
    const a = i * TAU / verts - Math.PI/2;
    const jitter = (i % 2 === 0 ? 1.0 : 0.75) + Math.sin(b.t*5 + i) * 0.04;
    const rr = b.r * jitter;
    const px = Math.cos(a) * rr;
    const py = Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // 内部裂纹
  ctx.strokeStyle = hexA(style.accent, 0.5);
  ctx.lineWidth = 2;
  for (let i = 0; i < 4; i++) {
    const a = i * TAU / 4 + b.t * 0.2;
    const r1 = b.r * 0.3;
    const r2 = b.r * 0.8;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*r1, Math.sin(a)*r1);
    ctx.lineTo(Math.cos(a + 0.3)*r2, Math.sin(a + 0.3)*r2);
    ctx.stroke();
  }
  ctx.restore();

  // 暴露核心
  const coreR = b.r*0.36+Math.sin(b.t*8)*5;
  setLight(true);
  glow(0, 0, coreR, b.phase === 3 ? '#ff5e7a' : style.accent, 0.8+b.coreGlow*0.3, 2.6);
  setLight(false);
  const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, coreR);
  cg.addColorStop(0, '#ffffff');
  cg.addColorStop(0.4, b.phase === 3 ? '#ff8a9c' : hexA(style.accent, 0.9));
  cg.addColorStop(1, b.phase === 3 ? '#c81f45' : hexA(style.dark, 1));
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(0, 0, coreR, 0, TAU); ctx.fill();

  // 蓄力光
  if (b.chargeFx > 0) {
    setLight(true);
    glow(0, 0, b.r*0.7, style.accent, b.chargeFx*0.55, 1.8);
    setLight(false);
  }
}

function drawBossBar() {
  if (!boss || boss.entering) return;
  const b = boss;
  const style = b.style || BOSS_STYLES[0];
  const x = 90, y = 118, w = W-180, h = 18;
  const ratio = clamp(b.hp/b.maxHp, 0, 1);

  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  roundRect(x, y, w, h, 9); ctx.fill();

  const g = ctx.createLinearGradient(x, 0, x+w, 0);
  g.addColorStop(0, style.main);
  g.addColorStop(1, style.accent);
  ctx.fillStyle = g;
  roundRect(x, y, Math.max(0, w*ratio), h, 9); ctx.fill();

  ctx.strokeStyle = 'rgba(255,200,150,0.6)';
  ctx.lineWidth = 2;
  roundRect(x, y, w, h, 9); ctx.stroke();

  // 阶段分隔线
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.lineWidth = 2;
  for (const p of [0.4, 0.7]) {
    ctx.beginPath();
    ctx.moveTo(x + w*p, y);
    ctx.lineTo(x + w*p, y + h);
    ctx.stroke();
  }

  // 标签
  ctx.fillStyle = style.accent;
  ctx.font = 'bold 22px "PingFang SC",sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(style.name, x, y-18);

  // 阶段指示
  ctx.textAlign = 'center';
  ctx.font = 'bold 16px "SF Mono",monospace';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText('PHASE ' + b.phase, W/2, y - 18);

  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,209,102,0.85)';
  ctx.font = 'bold 20px "SF Mono",monospace';
  ctx.fillText(Math.ceil(b.hp)+'', x+w, y-18);
}

function drawItems() {

    glow(it.x, it.y, r, c, 0.38, 1.9);

    ctx.translate(it.x, it.y);
    ctx.rotate(Math.sin(it.t*3)*0.18);

    ctx.fillStyle = g;
    ctx.strokeStyle = c;
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i*TAU/6-Math.PI/2;

}

}
function drawSwitchFx() {
  if (switchFx <= 0 || !player) return;
  const k = 1-switchFx;
  const r = 60+k*500;
  setLight(true);
  ctx.globalAlpha = switchFx*0.55;
  ctx.strokeStyle = switchColor;
  ctx.lineWidth = 10*switchFx;
  ctx.beginPath(); ctx.arc(player.x, player.y, r, 0, TAU); ctx.stroke();
  ctx.globalAlpha = switchFx*0.28;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(player.x, player.y, r*0.7, 0, TAU); ctx.stroke();
  ctx.globalAlpha = 1;
  setLight(false);
}
function drawLevelUpFx() {
  if (levelUpFx <= 0 || !player) return;
  const k = 1-levelUpFx;
  const r = 60+k*460;
  const c = WEAPON_DEF[player.weapon].color;
  setLight(true);
  ctx.globalAlpha = levelUpFx*0.55;
  ctx.strokeStyle = c;
  ctx.lineWidth = 8*levelUpFx;
  ctx.beginPath(); ctx.arc(player.x, player.y, r, 0, TAU); ctx.stroke();
  ctx.globalAlpha = levelUpFx*0.25;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(player.x, player.y, r*0.72, 0, TAU); ctx.stroke();
  ctx.globalAlpha = 1;
  setLight(false);
}

function drawButton(rect, label, color, big, pressed) {
  const scale = pressed ? 0.96 : 1;
  const cx = rect.x+rect.w/2, cy = rect.y+rect.h/2;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  ctx.translate(-cx, -cy);
  setLight(true);
  ctx.globalAlpha = 0.14;
  ctx.fillStyle = color;
  roundRect(rect.x, rect.y, rect.w, rect.h, 22); ctx.fill();
  ctx.globalAlpha = 1;
  setLight(false);
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  roundRect(rect.x, rect.y, rect.w, rect.h, 22); ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold ' + (big ? 40 : 32) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, cx, cy+2);
  ctx.restore();
}
function drawPanel(w, h) {
  ctx.fillStyle = 'rgba(3,8,20,0.8)';
  ctx.fillRect(0, 0, W, H);
  const x = W/2-w/2, y = H/2-h/2;
  const g = ctx.createLinearGradient(x, y, x, y+h);
  g.addColorStop(0, 'rgba(14,30,58,0.97)');
  g.addColorStop(1, 'rgba(6,14,30,0.97)');
  ctx.fillStyle = g;
  roundRect(x, y, w, h, 30); ctx.fill();
  ctx.strokeStyle = 'rgba(90,190,255,0.55)';
  ctx.lineWidth = 3;
  roundRect(x, y, w, h, 30); ctx.stroke();
  setLight(true);
  ctx.globalAlpha = 0.14;
  ctx.strokeStyle = '#5fe0ff';
  ctx.lineWidth = 10;
  roundRect(x, y, w, h, 30); ctx.stroke();
  ctx.globalAlpha = 1;
  setLight(false);
}
function drawMenu() {
  if (menuLayer) ctx.drawImage(menuLayer, 0, 0);

  ctx.fillStyle = '#ffd166';
  ctx.font = 'bold 62px "SF Mono",Menlo,Consolas,monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(fmt(bestScore), W/2, 700);

  drawButton(btnStart, '开始游戏', '#3ad6ff', true, menuClickFx > 0);

  ctx.fillStyle = 'rgba(150,210,255,' + (0.5 + Math.sin(gameTime*4)*0.3) + ')';
  ctx.font = 'bold 24px "PingFang SC",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('点击任意位置开始', W/2, 990);

  const weapons = ['pulse','spread','laser','missile','arc'];
  const startX = W/2-180;
  setLight(true);
  for (let i = 0; i < weapons.length; i++) {
    const w = WEAPON_DEF[weapons[i]];
    const x = startX+i*90;
    const y = 1120+Math.sin(gameTime*2+i*0.7)*6;
    ctx.globalAlpha = 0.25+Math.sin(gameTime*3+i)*0.15;
    ctx.fillStyle = w.color;
    ctx.beginPath(); ctx.arc(x, y, 26, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  setLight(false);

  ctx.save();
  ctx.translate(W/2, 780);
  ctx.scale(1.25, 1.25);
  drawShipShape(ctx, 'assault', 1, gameTime);
  ctx.restore();

  if (menuClickFx > 0) {
    ctx.globalAlpha = menuClickFx*0.5;
    ctx.fillStyle = '#3ad6ff';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
}
function drawPause() {
  drawPanel(560, 620);
  ctx.fillStyle = '#8ef2ff';
  ctx.font = 'bold 58px "PingFang SC",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('已暂停', W/2, 430);
  drawButton(btnResume, '继续游戏', '#3ad6ff');
  drawButton(btnPauseRestart, '重新开始', '#ffb027');
  drawButton(btnPauseQuit, '返回主页', '#8b7bff');
}
function drawRevive() {
  drawPanel(620, 640);
  ctx.fillStyle = '#ff5e7a';
  ctx.font = 'bold 58px "PingFang SC",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('战机坠毁', W/2, 400);
  ctx.fillStyle = 'rgba(190,225,255,0.85)';
  ctx.font = '27px "PingFang SC",sans-serif';
  ctx.fillText('每局战役可复活一次', W/2, 462);
  ctx.fillText('复活后生命恢复 1 点，武器等级下降 1 级', W/2, 502);
  ctx.fillStyle = 'rgba(150,190,230,0.6)';
  ctx.font = '21px "PingFang SC",sans-serif';
  ctx.fillText('（广告接口为模拟，正式版接入 SDK）', W/2, 558);
  drawButton(btnReviveAd, '看广告复活', '#7dffb0', true);
  drawButton(btnGiveUp, '放弃并结算', 'rgba(160,180,210,0.9)');
}
function drawAd() {
  drawPanel(600, 480);
  ctx.fillStyle = '#8ef2ff';
  ctx.font = 'bold 42px "PingFang SC",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('广告播放中', W/2, H/2-60);
  const total = 2.0;
  const prog = clamp(1-adTimer/total, 0, 1);
  const bw = 400, bh = 16, bx = W/2-bw/2, by = H/2+20;
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  roundRect(bx, by, bw, bh, 8); ctx.fill();
  ctx.fillStyle = '#7dffb0';
  roundRect(bx, by, bw*prog, bh, 8); ctx.fill();
  ctx.fillStyle = 'rgba(190,225,255,0.8)';
  ctx.font = '26px "SF Mono",Menlo,Consolas,monospace';
  ctx.fillText(Math.ceil(Math.max(0, adTimer))+'s', W/2, H/2+90);
}
function drawResult() {
  drawPanel(640, 760);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = resultVictory ? '#7dffb0' : '#ff8a3d';
  ctx.font = 'bold 62px "PingFang SC",sans-serif';
  ctx.fillText(resultVictory ? '全部通关！' : '游戏结束', W/2, 340);
  if (newRecord) {
    setLight(true);
    ctx.globalAlpha = 0.3+Math.sin(gameTime*6)*0.18;
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.arc(W/2, 470, 92, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    setLight(false);
    ctx.fillStyle = '#ffd166';
    ctx.font = 'bold 34px "PingFang SC",sans-serif';
    ctx.fillText('★ 新纪录 ★', W/2, 470);
  }
  ctx.fillStyle = 'rgba(190,225,255,0.85)';
  ctx.font = 'bold 30px "PingFang SC",sans-serif';
  ctx.fillText('本局得分', W/2, 552);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 76px "SF Mono",Menlo,Consolas,monospace';
  ctx.fillText(fmt(score), W/2, 620);
  ctx.font = '26px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(170,205,240,0.85)';
  const lines = [
    '最高分  '+fmt(bestScore),
    '击落  '+kills+'    到达  '+level.name,
    '最终速度  ×'+speedMul.toFixed(2)+'    复活  '+revivesUsed+' 次'
  ];
  for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], W/2, 690+i*34);
  drawButton(btnRestart, '再战 · 第'+(Math.floor(checkpointStage/3)+1)+'局', '#3ad6ff', true);
  drawButton(btnHome, '返回主页', 'rgba(160,180,210,0.9)');
}

/* ============================================================
   渲染
   ============================================================ */
function render() {
  const K = SCALE*DPR;
  if (landscape) ctx.setTransform(0, -K, K, 0, 0, canvas.height); // 旋转 90°：游戏上方 → 屏幕左侧
  else ctx.setTransform(K, 0, 0, K, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  lightMode = false;

  ctx.fillStyle = '#04050c';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(shakeX, shakeY);
  drawBackground();

  if (state !== State.MENU) {
    drawWaves();
    drawItems();
    for (const e of enemies) drawEnemy(e);
    drawBossBody();
    drawLasers();
    drawBullets();
    drawEBullets();
    drawArcs();
    drawHelpers();
    drawPlayerShip();
    drawSwitchFx();
    drawLevelUpFx();
    drawParticles();
    drawFloats();
  }
  ctx.restore();

  if (vignette) ctx.drawImage(vignette, 0, 0);

  if (state === State.MENU) drawMenu();
  else {
    drawHUD();
    if (state === State.PAUSE) drawPause();
    else if (state === State.REVIVE) drawRevive();
    else if (state === State.AD) drawAd();
    else if (state === State.RESULT) drawResult();
  }

  if (flash > 0) {
    ctx.globalAlpha = flash;
    ctx.fillStyle = flashColor;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
}

/* ============================================================
   主循环
   ============================================================ */
const STEP = 1/60;
let lastTime = 0, acc = 0;
let loopErrorCount = 0;

function loop(t) {
  requestAnimationFrame(loop);
  try {
    if (!lastTime) lastTime = t;
    let dt = (t-lastTime)/1000;
    lastTime = t;
    if (dt > 0.25) dt = 0.25;
    if (dt < 0) dt = 0;
    acc += dt;
    let guard = 0;
    while (acc >= STEP && guard < 5) {
      update(STEP);
      acc -= STEP;
      guard++;
    }
    if (guard >= 5) acc = 0;
    render();
    loopErrorCount = 0;
  } catch (err) {
    loopErrorCount++;
    console.error('Loop error:', err);
    if (loopErrorCount > 60) {
      try { state = State.MENU; lastTime = 0; acc = 0; loopErrorCount = 0; } catch (e) {}
    }
  }
}

/* 启动 */
resize();
buildBackgroundLayer(0);
buildVignette();
buildMenuLayer();
initStars();
requestAnimationFrame(loop);

})();
</script>
