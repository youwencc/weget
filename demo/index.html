let DPR = 1, SCALE = 1, landscape = false;
const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
const isLowEnd = isMobile && (navigator.hardwareConcurrency || 2) <= 4;

function resize() {
  const vw = window.innerWidth || W;
  const vh = window.innerHeight || H;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  // 横版：视口宽 > 高时，把竖版画面旋转 90° 铺满横屏（逻辑坐标不变）
  landscape = vw > vh;
  if (landscape) {
    SCALE = Math.min(vw / H, vh / W) || 0.5;
    canvas.style.width = Math.round(H * SCALE) + 'px';
    canvas.style.height = Math.round(W * SCALE) + 'px';
    canvas.width = Math.round(H * SCALE * DPR);
    canvas.height = Math.round(W * SCALE * DPR);
  } else {
    SCALE = Math.min(vw / W, vh / H) || 0.5;
    canvas.style.width = Math.round(W * SCALE) + 'px';
    canvas.style.height = Math.round(H * SCALE) + 'px';
    canvas.width = Math.round(W * SCALE * DPR);
    canvas.height = Math.round(H * SCALE * DPR);
  }
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 160));
window.addEventListener('load', resize);

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const rnd = (a, b) => a + Math.random() * (b - a);
const rand = (a) => Math.random() * a;
const fmt = n => String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const h1 = n => { const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); };
const hexA = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';
};

/* ============================================================
   音效
   ============================================================ */
const AudioSys = {
  ctx: null, master: null, ready: false, noiseBuf: null,
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.45;
      this.master.connect(this.ctx.destination);
      const len = Math.floor(this.ctx.sampleRate * 0.8);
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = buf;
      this.ready = true;
    } catch (e) {}
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} } },
  tone(freq, dur, type, vol, slideTo, delay) {
    if (!this.ready) return;
    try {
      const t = this.ctx.currentTime + (delay || 0);
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + dur + 0.05);
    } catch (e) {}
  },
  noise(dur, vol, freq, rate, delay) {
    if (!this.ready) return;
    try {
      const t = this.ctx.currentTime + (delay || 0);
      const src = this.ctx.createBufferSource();
      src.buffer = this.noiseBuf;
      src.playbackRate.value = rate || 1;
      const f = this.ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(freq || 1600, t);
      f.frequency.exponentialRampToValueAtTime(120, t + dur);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(this.master);
      src.start(t); src.stop(t + dur + 0.05);
    } catch (e) {}
  }
};

    AudioSys.noise(0.3, 0.05, 4000, 1.6);
  },
  shatter() {

  },
  bossCharge() {

  }
};

/* ============================================================
   绘制辅助
   ============================================================ */
let lightMode = false;
function setLight(on) {
  if (on === lightMode) return;
  lightMode = on;
  ctx.globalCompositeOperation = on ? 'lighter' : 'source-over';
}
function glow(x, y, r, color, a, scale) {
  ctx.globalAlpha = (a === undefined ? 0.3 : a);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r * (scale === undefined ? 1.8 : scale), 0, TAU);
  ctx.fill();
  ctx.globalAlpha = 1;
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* 10 种背景动画模式 */
function drawBgMode(pal, t) {
  ctx.save();
  switch (bgMode) {
    case 'grid': // 流动横光带
      ctx.globalAlpha = 0.08; ctx.strokeStyle = pal.grid; ctx.lineWidth = 3;
      for (let k = 0; k < 6; k++) {
        const y = ((t*260 + k*213) % (H+160)) - 80;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }
      break;
    case 'rain': // 垂直光雨
      ctx.strokeStyle = pal.grid; ctx.lineWidth = 2;
      for (let k = 0; k < 34; k++) {
        const x = h1(k*3.1)*W;
        const len = 40 + h1(k*7.7)*90;
        const sp = 380 + h1(k*5.3)*420;
        const y = ((h1(k)*H + t*sp) % (H+len)) - len;
        ctx.globalAlpha = 0.10 + h1(k*2.3)*0.14;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y+len); ctx.stroke();
      }
      break;
    case 'aurora': // 极光带
      for (let k = 0; k < 3; k++) {
        ctx.globalAlpha = 0.10 + Math.sin(t*0.8+k*2.1)*0.05;
        ctx.strokeStyle = k === 1 ? pal.star : pal.grid;
        ctx.lineWidth = 26 + k*14;
        ctx.beginPath();
        for (let x = -40; x <= W+40; x += 40) {
          const y = 180 + k*230 + Math.sin(x*0.008 + t*(0.7+k*0.2) + k)*70;
          if (x === -40) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      break;
    case 'warp': // 顶部放射跃迁线
      ctx.translate(W/2, -60);
      ctx.rotate(t*0.1);
      ctx.strokeStyle = pal.grid;
      for (let k = 0; k < 20; k++) {
        const a = k*TAU/20;
        ctx.globalAlpha = k%5 === 0 ? 0.10 : 0.05;
        ctx.lineWidth = k%5 === 0 ? 3 : 1.5;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*140, Math.sin(a)*140+80);
        ctx.lineTo(Math.cos(a)*1500, Math.sin(a)*1500+80);
        ctx.stroke();
      }
      break;
    case 'orbit': // 环绕轨道
      ctx.translate(W/2, 340);
      for (let k = 0; k < 3; k++) {
        const r = 180 + k*130;
        ctx.globalAlpha = 0.10;
        ctx.strokeStyle = pal.grid; ctx.lineWidth = 2;
        ctx.setLineDash([26, 18]);
        ctx.lineDashOffset = t*(30+k*22)*(k%2 ? -1 : 1);
        ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
        ctx.setLineDash([]);
        const a = t*(0.5+k*0.25)*(k%2 ? -1 : 1);
        ctx.globalAlpha = 0.30;
        ctx.fillStyle = pal.star;
        ctx.beginPath(); ctx.arc(Math.cos(a)*r, Math.sin(a)*r, 5, 0, TAU); ctx.fill();
      }
      break;
    case 'comets': // 斜向流星
      for (let k = 0; k < 9; k++) {
        const sp = 300 + h1(k*4.7)*300;
        const cyc = H + 300;
        const p = (h1(k*1.9)*cyc + t*sp) % cyc;
        const x = h1(k*8.3)*W + p*0.35;
        const y = p - 150;
        ctx.globalAlpha = 0.16 + h1(k*2.9)*0.12;
        ctx.strokeStyle = pal.star; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x-46, y-70); ctx.stroke();
      }
      break;
    case 'nebula': // 呼吸星云
      for (let k = 0; k < 3; k++) {
        const x = (0.25 + h1(k*3.7)*0.5)*W;
        const y = (0.2 + h1(k*6.1)*0.6)*H;
        const r = 200 + h1(k*9.2)*180 + Math.sin(t*0.6+k*2.4)*40;
        ctx.globalAlpha = 0.10 + Math.sin(t*0.5+k*2.1)*0.05;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, pal.nebs[k%4]); g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
      }
      break;
    case 'scan': // 扫描线
      ctx.globalAlpha = 0.10; ctx.strokeStyle = pal.grid; ctx.lineWidth = 2;
      for (let y = 20; y < H; y += 46) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }
      const sy = (t*140) % (H+220) - 110;
      ctx.globalAlpha = 0.16; ctx.lineWidth = 5; ctx.strokeStyle = pal.star;
      ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(W, sy); ctx.stroke();
      break;
    case 'bars': // 漂移竖条
      for (let k = 0; k < 10; k++) {
        const bw = 40 + h1(k*3.3)*80;
        const x = ((h1(k*5.9)*W) + t*(14+h1(k)*26)*(k%2 ? -1 : 1) + W + bw*4) % (W+bw) - bw;
        ctx.globalAlpha = 0.05;
        ctx.fillStyle = pal.grid;
        ctx.fillRect(x, 0, bw, H);
      }
      break;
    case 'rings': // 底部扩散环
      for (let k = 0; k < 5; k++) {
        const r = (t*90 + k*180) % 900;
        ctx.globalAlpha = Math.max(0, 0.12*(1 - r/900));
        ctx.strokeStyle = pal.grid; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(W/2, H+120, 60+r, 0, TAU); ctx.stroke();
      }
      break;
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}
function drawBackground() {

function addParticle(o) { if (particles.length < MAX_PARTICLES) particles.push(o); }
function spark(x, y, color, count, speed, size) {
  for (let i = 0; i < count; i++) {
    const a = rand(TAU);
    const sp = rnd(speed*0.35, speed);
    addParticle({ type:'spark', x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      t:0, life:rnd(0.18,0.42), size:(size||2)*rnd(0.6,1.4), color, drag:0.90 });
  }
}
function debris(x, y, color, count, speed, size) {
  for (let i = 0; i < count; i++) {
    const a = rand(TAU);
    const sp = rnd(speed*0.3, speed);
    addParticle({ type:'debris', x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      t:0, life:rnd(0.4,0.9), size:(size||4)*rnd(0.6,1.5), color, drag:0.965,
      rot:rand(TAU), vr:rnd(-9,9) });
  }
}
function smoke(x, y, count, size, color) {
  for (let i = 0; i < count; i++) {
    const a = rand(TAU);
    const sp = rnd(10,90);
    addParticle({ type:'smoke', x:x+rnd(-10,10), y:y+rnd(-10,10),
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-20,
      t:0, life:rnd(0.45,1.0), size:(size||16)*rnd(0.6,1.4),
      color:color||'rgba(255,150,80,0.5)', drag:0.96 });
  }
}
function shockwave(x, y, maxR, color, width, life) {
  if (waves.length >= MAX_WAVES) return;
  waves.push({ x, y, r:4, maxR, t:0, life:life||0.45, color, width:width||4 });
}
function addFloat(x, y, text, color, size, crit) {
  floats.push({ x, y, text, color, t:0, life:1.0, size:size||27, crit:!!crit });
}
function updateParticles(dt) {
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt;
    if (p.t >= p.life) { particles.splice(i,1); continue; }
    const d = Math.pow(p.drag, dt*60);
    p.vx *= d; p.vy *= d;
    p.x += p.vx*dt; p.y += p.vy*dt;
    if (p.type === 'debris') p.rot += p.vr*dt;
  }
}
function updateWaves(dt) {
  for (let i = waves.length-1; i >= 0; i--) {
    const w = waves[i];
    w.t += dt;
    if (w.t >= w.life) { waves.splice(i,1); continue; }
    const k = w.t/w.life;
    w.r = 4 + (w.maxR-4)*(1-Math.pow(1-k,2.4));
  }
}
function updateFloats(dt) {
  for (let i = floats.length-1; i >= 0; i--) {
    const f = floats[i];
    f.t += dt; f.y -= 66*dt;
    if (f.t >= f.life) floats.splice(i,1);
  }
}
function drawParticles() {
  setLight(true);
  for (const p of particles) {
    const k = p.t/p.life;
    const a = 1-k;
    if (p.type === 'spark') {
      ctx.globalAlpha = a*0.95;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = p.size;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx*0.018, p.y - p.vy*0.018);
      ctx.stroke();
    } else if (p.type === 'debris') {
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      const s = p.size*a;
      ctx.fillRect(-s/2, -s/2, s, s*0.7);
      ctx.restore();
    } else {
      ctx.globalAlpha = a*0.42;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size*(0.5+k*1.6), 0, TAU);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  setLight(false);
}
function drawWaves() {
  setLight(true);
  for (const w of waves) {
    const k = w.t/w.life;
    ctx.globalAlpha = (1-k)*0.85;
    ctx.strokeStyle = w.color;
    ctx.lineWidth = w.width*(1-k*0.7);
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  setLight(false);
}
function drawFloats() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const f of floats) {
    const k = f.t/f.life;
    let a = 1-k;
    if (k < 0.14) a = k/0.14;
    const pop = k < 0.2 ? 1+(1-k/0.2)*0.5 : 1;
    ctx.globalAlpha = a;
    ctx.font = 'bold ' + Math.round(f.size*pop) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.lineWidth = 6;
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

const btnPauseQuit    = { x: W/2-140, y: 845,  w: 280, h: 84 };
const btnReviveAd     = { x: W/2-185, y: 640,  w: 370, h: 108 };
const btnGiveUp       = { x: W/2-140, y: 790,  w: 280, h: 84 };
const btnRestart      = { x: W/2-170, y: 800,  w: 340, h: 104 };
const btnHome         = { x: W/2-140, y: 935,  w: 280, h: 84 };

function toLogic(e) {
  const r = canvas.getBoundingClientRect();
  if (!r.width || !r.height) return { x: W/2, y: H/2 };
  const px = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
  const py = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
  const rx = (px-r.left)/r.width, ry = (py-r.top)/r.height;
  if (landscape) return { x: (1-ry)*W, y: rx*H }; // 逆旋转映射
  return { x: rx*W, y: ry*H };
}
function inRect(p, r, pad) {
  const pad2 = pad || 0;
  return p.x >= r.x-pad2 && p.x <= r.x+r.w+pad2 && p.y >= r.y-pad2 && p.y <= r.y+r.h+pad2;
}
function inCircle(p, c, extra) {
  const rr = c.r + (extra||0);
  return (p.x-c.x)*(p.x-c.x) + (p.y-c.y)*(p.y-c.y) <= rr*rr;
}

function handleMenuClick(p) {
  menuClickFx = 1;
  flashScreen(0.25, '#3ad6ff');
  SFX.ui();
  try { startGame(); } catch (err) {
    console.error('startGame error:', err);
    try {
      if (!player) {
        player = { x:W/2, y:H-240, r:14, hp:3, maxHp:3, shield:0, bombs:1, magnet:0,
          inv:2.2, fireCd:0, arcCd:0, alive:true, tilt:0, bank:0, engineFlick:0, trailTimer:0,
          weapon:'pulse', weaponLv:1, wings:0, orbs:0, rate:0, crit:0, pierce:0, shipType:'assault' };
      }
      bullets=bullets||[]; ebullets=ebullets||[]; enemies=enemies||[]; items=items||[];
      particles=particles||[]; waves=waves||[]; floats=floats||[]; helpers=helpers||[]; arcs=arcs||[];
      levelIndex=0; level=LEVELS[0]; phase='wave';
      score=0; kills=0; elapsed=0; speedMul=1;
      state = State.PLAY;
    } catch (e2) { console.error(e2); }
  }
}

function onDown(e) {
  try {
    AudioSys.init(); AudioSys.resume();
    const p = toLogic(e);

    if (state === State.MENU) {
      if (inRect(p, btnStart, 40) || (p.x > 0 && p.x < W && p.y > 200 && p.y < H)) {
        handleMenuClick(p);
      }
      return;
    }
    if (state === State.PLAY) {
      if (inCircle(p, bombBtn, 12)) { useBomb(); return; }
      if (inCircle(p, pauseBtn, 10)) { state = State.PAUSE; SFX.ui(); return; }
      if (inCircle(p, shipBtn, 14)) { cycleShip(); return; }
      if (pointer.active) return;
      pointer.active = true;
      pointer.id = e.pointerId;
      pointer.tx = p.x; pointer.ty = p.y - 70;
      const d = Math.hypot(pointer.tx - player.x, pointer.ty - player.y);
      pointer.snap = d > 110;
      return;
    }
    if (state === State.PAUSE) {
      if (inRect(p, btnResume, 20)) { state = State.PLAY; SFX.ui(); }
      else if (inRect(p, btnPauseRestart, 20)) { SFX.ui(); startGame(); }
      else if (inRect(p, btnPauseQuit, 20)) { SFX.ui(); state = State.MENU; }
      return;
    }
    if (state === State.REVIVE) {
      if (inRect(p, btnReviveAd, 20)) { SFX.ui(); watchAd(); }
      else if (inRect(p, btnGiveUp, 20)) { SFX.ui(); endGame(false); }
      return;
    }
    if (state === State.RESULT) {
      if (inRect(p, btnRestart, 20)) { SFX.ui(); startGame(checkpointStage, checkpointScore); }
      else if (inRect(p, btnHome, 20)) { SFX.ui(); state = State.MENU; }
      return;
    }
  } catch (err) {
    console.error('onDown error:', err);
  }
}
function onMove(e) {
  if (!pointer.active || e.pointerId !== pointer.id) return;
  if (state !== State.PLAY) return;
  const p = toLogic(e);
  pointer.tx = p.x; pointer.ty = p.y - 70;
}
function onUp(e) {
  if (e.pointerId !== pointer.id) return;
  pointer.active = false; pointer.id = -1;
}

canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
canvas.addEventListener('pointerleave', onUp);
canvas.addEventListener('click', e => {
  if (state === State.MENU) {
    const p = toLogic(e);
    handleMenuClick(p);
  }
});
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' && state === State.PLAY) { useBomb(); e.preventDefault(); }
  if (e.key === 'Escape' && state === State.PLAY) state = State.PAUSE;
  if ((e.key === 'q' || e.key === 'Q') && state === State.PLAY) cycleShip();
  if (e.key === 'Enter' && state === State.MENU) { SFX.ui(); startGame(); }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });
document.addEventListener('touchmove', e => e.preventDefault(), { passive:false });

/* ============================================================
   流程
   ============================================================ */
function startGame(fromStage, fromScore) {
  score = typeof fromScore === 'number' ? fromScore : 0;
  player = {
    x: W/2, y: H-240, r: 14,
    hp: 3, maxHp: 3,
    shield: 0, bombs: 1, magnet: 0,
    inv: 2.2, fireCd: 0, arcCd: 0,
    alive: true, tilt: 0, bank: 0, engineFlick: 0, trailTimer: 0,
    weapon: 'pulse', weaponLv: 1,
    wings: 0, orbs: 0,
    rate: 0, crit: 0, pierce: 0,
    shipType: 'assault'
  };
  bullets=[]; ebullets=[]; enemies=[]; items=[]; particles=[]; waves=[]; floats=[]; helpers=[]; arcs=[];
  kills=0; elapsed=0; revivesUsed=0; deathTimer=-1;
  boss=null; bossWarnTimer=0; clearTimer=0;
  pointer.active=false; pointer.id=-1;
  shakeAmount=0; shakeX=0; shakeY=0; flash=0;
  slowTimer=0; hitStop=0; levelUpFx=0; switchFx=0; shipSwitchFx=0;
  switchCd=0; speedMul=1;
  comboCount=0; comboTimer=0;
  seenWeapons = {};
  startLevel(fromStage || 0);
  state = State.PLAY;
}
function startLevel(i) {
  levelIndex = i;
  level = LEVELS[i];
  if (level.stage === 0) { checkpointStage = i; checkpointScore = score; }
  buildBackgroundLayer(i);
  levelTimer = 0;
  spawnTimer = 0.7;
  healTimer = 7;
  eliteUsed = [false, false];
  phase = 'wave';
  boss = null; bossWarnTimer = 0; clearTimer = 0;
  if (enemies) enemies.length = 0;
  if (ebullets) ebullets.length = 0;
  if (helpers) helpers.length = 0;
  if (arcs) arcs.length = 0;
}
function endGame(victory) {
  resultVictory = !!victory;
  if (score > bestScore) { bestScore = score; saveBest(bestScore); newRecord = true; }
  else newRecord = false;
  state = State.RESULT;
}
function watchAd() { adTimer = 2.0; state = State.AD; }
function doRevive() {
  revivesUsed++;
  player.alive = true;
  player.hp = 1;
  if (player.weaponLv > 1) player.weaponLv--;
  player.inv = 3.0;
  player.x = W/2; player.y = H-260;
  player.shield = 0;
  ebullets.length = 0;
  pointer.active = false; pointer.id = -1;
  shockwave(player.x, player.y, 320, '#7dffb0', 6, 0.6);
  flashScreen(0.4, '#7dffb0');
  SFX.shield();
  state = State.PLAY;
}
function shake(v) { shakeAmount = Math.max(shakeAmount, v); }
function flashScreen(v, color) { flash = Math.max(flash, v); if (color) flashColor = color; }

/* 速度递增 */
function updateSpeedMul() {
  const maxBonus = 0.6;
  const rampTime = 180;
  speedMul = 1 + Math.min(elapsed / rampTime, 1) * maxBonus;
}

/* ============================================================
   机型切换
   ============================================================ */
function cycleShip() {
  if (switchCd > 0 || state !== State.PLAY || !player || !player.alive) return;
  const idx = SHIP_ORDER.indexOf(player.shipType);
  const next = SHIP_ORDER[(idx+1) % SHIP_ORDER.length];
  applyShip(next);
}
function applyShip(type) {
  const def = SHIP_DEF[type];
  if (!def) return;
  player.shipType = type;
  player.maxHp = def.maxHp;
  player.hp = Math.min(player.hp, def.maxHp);
  if (player.hp <= 0) player.hp = 1;
  player.r = def.r;
  player.weapon = def.weapon;
  if (player.weaponLv > 3) player.weaponLv = 3;
  switchCd = SWITCH_COOLDOWN;
  shipSwitchFx = 1;
  triggerShipSwitch(type);
}
function triggerShipSwitch(type) {
  const def = SHIP_DEF[type];
  switchFx = 1;
  switchColor = def.color;
  player.inv = Math.max(player.inv, 1.2);
  shake(14);
  slowTimer = 0.18;
  flashScreen(0.25, def.color);
  shockwave(player.x, player.y, 420, def.color, 9, 0.6);
  shockwave(player.x, player.y, 280, '#ffffff', 4, 0.45);
  spark(player.x, player.y, def.color, 36, 480, 3);
  spark(player.x, player.y, '#ffffff', 18, 340, 2);
  addFloat(player.x, player.y-100, def.name, def.color, 44, true);
  addFloat(player.x, player.y-58, def.desc, '#cfe8ff', 22);
  SFX.shipSwitch();
}

/* ============================================================
   玩家
   ============================================================ */
function updatePlayer(dt) {
  const p = player;
  const shipDef = SHIP_DEF[p.shipType];
  if (pointer.active) {
    const tx = clamp(pointer.tx, 26, W-26);
    const ty = clamp(pointer.ty, 96, H-56);
    if (pointer.snap) {
      const k = Math.min(1, dt*18);
      p.x += (tx-p.x)*k; p.y += (ty-p.y)*k;
      if (Math.hypot(tx-p.x, ty-p.y) < 12) pointer.snap = false;
    } else { p.x = tx; p.y = ty; }
  }
  let kx = 0, ky = 0;
  if (keys['ArrowLeft']||keys['a']||keys['A']) kx -= 1;
  if (keys['ArrowRight']||keys['d']||keys['D']) kx += 1;
  if (keys['ArrowUp']||keys['w']||keys['W']) ky -= 1;
  if (keys['ArrowDown']||keys['s']||keys['S']) ky += 1;
  if (kx || ky) {
    const len = Math.hypot(kx, ky) || 1;
    p.x = clamp(p.x + kx/len*shipDef.speed*dt, 26, W-26);
    p.y = clamp(p.y + ky/len*shipDef.speed*dt, 96, H-56);
  }
  const targetTilt = (p.x-W/2)/(W/2)*0.30;
  p.tilt += (targetTilt-p.tilt)*Math.min(1, dt*12);
  const targetBank = clamp((p.x-W/2)/240, -1, 1);
  p.bank += (targetBank-p.bank)*Math.min(1, dt*9);
  p.inv = Math.max(0, p.inv-dt);
  p.magnet = Math.max(0, p.magnet-dt);
  p.engineFlick += dt*30;
  p.trailTimer -= dt;
  if (p.trailTimer <= 0) {
    p.trailTimer = 0.022;
    addParticle({ type:'spark', x:p.x+rnd(-5,5), y:p.y+22,
      vx:rnd(-26,26), vy:rnd(110,200), t:0, life:rnd(0.16,0.3),
      size:rnd(1.6,3.2), color:Math.random()<0.5?shipDef.color:'#a8f0ff', drag:0.92 });
  }
  p.fireCd -= dt;
  if (p.fireCd <= 0) { shoot(); p.fireCd = fireInterval(); }
  if (p.weapon === 'arc') {
    p.arcCd -= dt;
    if (p.arcCd <= 0) { p.arcCd = 0.16/(1+p.rate*0.2); spawnArc(); }
  }
}
function fireInterval() {
  const mul = SHIP_DEF[player.shipType].fireRateMul;
  return 0.145*mul*Math.pow(0.82, player.rate);
}
function addBullet(x, y, vx, vy, dmg, weapon, opts) {
  if (bullets.length >= 120) return;
  const o = opts || {};
  bullets.push({ x, y, vx, vy, dmg, weapon, r:o.big?8:5, big:!!o.big,
    homing:!!o.homing, pierce:o.pierce||0, hit:null, dead:false });
}
function shoot() {
  const p = player;
  const y = p.y-28;
  const lv = p.weaponLv;
  switch (p.weapon) {
    case 'pulse': {
      const spd = 940;
      if (lv === 1) addBullet(p.x, y, 0, -spd, 1.3, 'pulse');
      else if (lv === 2) {
        addBullet(p.x-11, y, 0, -spd, 1.2, 'pulse');
        addBullet(p.x+11, y, 0, -spd, 1.2, 'pulse');
      } else {
        addBullet(p.x, y-6, 0, -spd*1.05, 1.6, 'pulse', {big:true});
        addBullet(p.x-15, y+6, -140, -spd, 1.1, 'pulse');
        addBullet(p.x+15, y+6, 140, -spd, 1.1, 'pulse');
      }
      SFX.shoot();
      break;
    }
    case 'spread': {
      const count = lv === 1 ? 3 : lv === 2 ? 5 : 7;
      const spread = lv === 1 ? 0.24 : lv === 2 ? 0.40 : 0.54;
      const spd = 830;
      for (let i = 0; i < count; i++) {
        const a = -Math.PI/2 + (i-(count-1)/2)*spread;
        addBullet(p.x, y, Math.cos(a)*spd, Math.sin(a)*spd, 0.9, 'spread');
      }
      SFX.shoot();
      break;
    }
    case 'laser': SFX.laser(); break;
    case 'missile': {
      const count = lv;
      const spd = 640;
      for (let i = 0; i < count; i++) {
        const off = (i-(count-1)/2)*22;
        addBullet(p.x+off, y, off*3, -spd, 1.6, 'missile', {homing:true, big:true});
      }
      SFX.missile();
      break;
    }
    case 'arc': break;
  }
  if (p.wings > 0 || p.orbs > 0) shootHelpers();
}
function shootHelpers() {
  const p = player;
  for (const h of helpers) {
    if (h.cd > 0) continue;
    if (h.type === 'wing') {
      h.cd = 0.20/(1+p.rate*0.2);
      addBullet(h.x, h.y-18, 0, -900, 0.9, 'pulse');
    } else {
      h.cd = 0.24/(1+p.rate*0.2);
      let target = null, minD = Infinity;
      for (const e of enemies) {
        if (e.dead) continue;
        const d = (e.x-h.x)**2+(e.y-h.y)**2;
        if (d < minD) { minD = d; target = e; }
      }
      if (boss && !boss.entering) {
        const d = (boss.x-h.x)**2+(boss.y-h.y)**2;
        if (d < minD) { minD = d; target = boss; }
      }
      let ang = -Math.PI/2;
      if (target) ang = Math.atan2(target.y-h.y, target.x-h.x);
      addBullet(h.x, h.y, Math.cos(ang)*820, Math.sin(ang)*820, 1.0, 'pulse');
    }
    SFX.shoot();
  }
}
function rollCrit() { return player.crit > 0 && Math.random() < player.crit*0.10; }
function updateLaser(dt) {
  const p = player;
  if (p.weapon !== 'laser' || !p.alive) return;
  const lv = p.weaponLv;
  const beams = lv;
  const width = 12+lv*5;
  const dps = 14+lv*10;
  const isCrit = rollCrit();
  const dmg = dps*dt*(isCrit?2:1);
  for (const e of enemies) {
    if (e.dead) continue;
    for (let i = 0; i < beams; i++) {
      const off = (i-(beams-1)/2)*30;
      const lx = p.x+off;
      if (e.y < p.y && Math.abs(e.x-lx) < e.r+width/2) {
        e.hp -= dmg;
        e.flash = 0.06;
        if (Math.random() < 0.3) spark(lx, e.y, '#c58bff', 1, 120, 1.4);
        if (e.hp <= 0) destroyEnemy(e);
      }
    }
  }
  enemies = enemies.filter(e => !e.dead);
  if (boss && !boss.entering) {
    for (let i = 0; i < beams; i++) {
      const off = (i-(beams-1)/2)*30;
      const lx = p.x+off;
      if (Math.abs(boss.x-lx) < boss.r+width/2) {
        boss.hp -= dmg;
        boss.flash = 0.05;
        if (Math.random() < 0.3) spark(lx, boss.y+rnd(-30,30), '#c58bff', 1, 140, 1.5);
        if (boss.hp <= 0) destroyBoss();
      }
    }
  }
}
function spawnArc() {
  const p = player;
  const targets = [];
  for (const e of enemies) if (!e.dead) targets.push(e);
  if (boss && !boss.entering) targets.push(boss);
  if (targets.length === 0) return;
  targets.sort((a, b) => {
    const da = (a.x-p.x)**2+(a.y-p.y)**2;
    const db = (b.x-p.x)**2+(b.y-p.y)**2;
    return da-db;
  });
  const maxChain = p.weaponLv+1;
  const chain = targets.slice(0, maxChain);
  const baseDmg = 3+p.weaponLv*2;
  const points = [{ x:p.x, y:p.y-24 }];
  for (const t of chain) {
    points.push({ x:t.x, y:t.y });
    const isCrit = rollCrit();
    t.hp -= baseDmg*(isCrit?2:1);
    t.flash = 0.12;
    spark(t.x, t.y, '#7dffb0', 4, 180, 1.8);
    if (isCrit) addFloat(t.x, t.y-20, 'CRIT', '#ffd166', 24, true);
    if (t.hp <= 0) {
      if (t === boss) destroyBoss();
      else destroyEnemy(t);
    }
  }
  enemies = enemies.filter(e => !e.dead);
  arcs.push({ points, t:0, life:0.18 });
  SFX.arc();
}
function updateArcs(dt) {
  for (let i = arcs.length-1; i >= 0; i--) {
    arcs[i].t += dt;
    if (arcs[i].t >= arcs[i].life) arcs.splice(i, 1);
  }
}
function updateHelpers(dt) {
  if (!player.alive) { helpers.length = 0; return; }
  const p = player;
  const want = [];
  for (let i = 0; i < p.wings; i++) want.push({ type:'wing', idx:i });
  for (let i = 0; i < p.orbs; i++) want.push({ type:'orb', idx:i });
  while (helpers.length > want.length) helpers.pop();
  while (helpers.length < want.length) helpers.push({ type:'wing', x:0, y:0, cd:0, idx:0 });
  for (let i = 0; i < want.length; i++) {
    const h = helpers[i];
    h.type = want[i].type;
    h.idx = want[i].idx;
    if (h.type === 'wing') {
      const side = h.idx === 0 ? -1 : 1;
      h.x = p.x+side*50; h.y = p.y+22;
    } else {
      const ang = gameTime*2.2+h.idx*Math.PI;
      h.x = p.x+Math.cos(ang)*58;
      h.y = p.y+Math.sin(ang)*58;
    }
    h.cd -= dt;
  }
}

/* ============================================================
   敌弹
   ============================================================ */
const EBULLET_TYPES = {
  normal:{color:'#ff5e9c',r:7}, aimed:{color:'#ff5e9c',r:7}, wave:{color:'#c58bff',r:6},
  homing:{color:'#ff8a3d',r:8}, bomb:{color:'#ffb027',r:11}, ring:{color:'#5fe0ff',r:7}
};
const EBULLET_HP = { normal:1, aimed:1, wave:1, homing:2, bomb:3, ring:1 };
const EBULLET_SCORE = { normal:6, aimed:6, wave:7, homing:12, bomb:18, ring:7 };
const EBULLET_DMG = { normal:1, aimed:1, wave:1, homing:1, bomb:2, ring:1 };

function addEBullet(x, y, ang, spd, opts) {
  if (ebullets.length >= MAX_EBULLETS) return;
  const o = opts || {};
  const t = o.type || 'normal';
  const def = EBULLET_TYPES[t] || EBULLET_TYPES.normal;
  const realSpd = spd * speedMul * (level ? (level.bulletSpeed||1) : 1);
  const hp = EBULLET_HP[t] || 1;
  ebullets.push({
    x, y, sx:x, sy:y,
    vx: Math.cos(ang)*realSpd, vy: Math.sin(ang)*realSpd,
    baseVx: Math.cos(ang)*realSpd, baseVy: Math.sin(ang)*realSpd,
    speed: realSpd, angle: ang,
    r: o.r || def.r,
    color: o.color || def.color,
    type: t,
    t: 0,
    life: o.life || 9,
    homing: o.homing || 0,
    homingDelay: o.homingDelay || 0,
    wave: o.wave || null,
    accel: o.accel || 0,
    hp: hp,
    maxHp: hp,
    dmg: Math.min(3, (EBULLET_DMG[t]||1) + (level ? (level.dmgAdd||0) : 0)),
    scoreValue: EBULLET_SCORE[t] || 5,
    flash: 0,
    dead: false
  });
}
function explodeBomb(b) {
  spark(b.x, b.y, '#ffb027', 16, 380, 2.6);
  spark(b.x, b.y, '#ffffff', 8, 280, 1.8);
  shockwave(b.x, b.y, 110, '#ffb027', 4, 0.35);
  SFX.boom();
  for (let i = 0; i < 8; i++) {
    const ang = i*TAU/8+rand(0.3);
    addEBullet(b.x, b.y, ang, 260, { r:6, color:'#ffb027', type:'normal' });
  }
}
function updateEBullets(dt) {
  for (let i = ebullets.length-1; i >= 0; i--) {
    const b = ebullets[i];
    b.t += dt;
    if (b.flash > 0) b.flash = Math.max(0, b.flash - dt);
    if (b.homing > 0 && b.t > b.homingDelay && player.alive) {
      const targetAng = Math.atan2(player.y-b.y, player.x-b.x);
      const curAng = Math.atan2(b.vy, b.vx);
      let diff = targetAng-curAng;
      while (diff > Math.PI) diff -= TAU;
      while (diff < -Math.PI) diff += TAU;
      const turn = Math.sign(diff)*Math.min(Math.abs(diff), b.homing*dt);
      const newAng = curAng+turn;
      b.vx = Math.cos(newAng)*b.speed;
      b.vy = Math.sin(newAng)*b.speed;
    }
    if (b.accel) {
      b.speed += b.accel*dt;
      const ang = Math.atan2(b.vy, b.vx);
      b.vx = Math.cos(ang)*b.speed;
      b.vy = Math.sin(ang)*b.speed;
    }
    if (b.wave) {
      const baseSpeed = Math.hypot(b.baseVx, b.baseVy) || 1;
      const perpX = -b.baseVy/baseSpeed;
      const perpY = b.baseVx/baseSpeed;
      const off = Math.sin(b.t*b.wave.freq)*b.wave.amp;
      b.x = b.sx + b.baseVx*b.t + perpX*off;
      b.y = b.sy + b.baseVy*b.t + perpY*off;
    } else {
      b.x += b.vx*dt; b.y += b.vy*dt;
    }
    if (b.type === 'bomb' && b.y > H-80) {
      explodeBomb(b); ebullets.splice(i, 1); continue;
    }
    if (b.y > H+80 || b.y < -160 || b.x < -100 || b.x > W+100) ebullets.splice(i, 1);
  }
}

function shatterBullet(b) {
  const c = b.color;
  const n = b.maxHp >= 3 ? 12 : (b.maxHp >= 2 ? 9 : 6);
  for (let i = 0; i < n; i++) {

    addParticle({

      t:0, life:rnd(0.25, 0.55), size:rnd(2, 4.5),
      color:c, drag:0.94, rot:rand(TAU), vr:rnd(-12, 12)
    });

  spark(b.x, b.y, '#ffffff', 4, 280, 1.8);
  spark(b.x, b.y, c, 5, 220, 1.6);
  shockwave(b.x, b.y, 46, c, 2.5, 0.28);
  addFloat(b.x, b.y - 12, '+' + b.scoreValue, c, 18);
  SFX.shatter();
}

/* ============================================================
   受伤 / 炸弹
   ============================================================ */
function hurtPlayer(dmg) {
  const d = dmg || 1;
  if (!player.alive || player.inv > 0) return;
  if (player.shield > 0) {
    player.shield--;
    player.inv = 0.8;
    SFX.shield();
    shockwave(player.x, player.y, 150, '#7dffb0', 4, 0.35);
    spark(player.x, player.y, '#7dffb0', 14, 320, 2.4);
    addFloat(player.x, player.y-50, '护盾抵挡', '#7dffb0', 26);

  }
  player.hp -= d;
  player.inv = 1.3;
  shake(22);
  slowTimer = 0.26;

  spark(player.x, player.y, '#ff5e7a', 26, 420, 3);
  debris(player.x, player.y, '#ff8a9c', 10, 300, 4);

    bigExplosion(player.x, player.y, SHIP_DEF[player.shipType].color, 1.2);
    SFX.bigBoom();
    shake(34);
    deathTimer = 1.0;
  }
}
function useBomb() {
  if (state !== State.PLAY || !player.alive || player.bombs <= 0) return;
  player.bombs--;
  SFX.bomb();
  shake(32);
  flashScreen(0.6, '#ffd166');
  slowTimer = 0.3;
  shockwave(player.x, player.y, 980, '#ffd166', 12, 0.7);
  shockwave(player.x, player.y, 700, '#ffffff', 6, 0.55);
  for (let i = 0; i < 60; i++) {
    addParticle({ type:'spark', x:rand(W), y:rand(H),
      vx:rnd(-140,140), vy:rnd(-260,-40), t:0, life:rnd(0.3,0.7),
      size:rnd(1.5,3.5), color:['#ffd166','#ffffff','#ff8a3d'][i%3], drag:0.94 });
  }
  for (const b of ebullets) {
    if (b.y > -50 && b.y < H+50) {
      addParticle({ type:'spark', x:b.x, y:b.y, vx:rnd(-60,60), vy:rnd(-60,60),
        t:0, life:0.3, size:2, color:b.color, drag:0.9 });

function bigExplosion(x, y, color, scale) {

function spawnEnemy(type, x, y, opts) {
  const d = ENEMY_DEF[type];
  if (!d) return;
  const o = opts || {};
  const hp = Math.max(1, Math.round(d.hp*level.hpMul*(o.hpMul||1)));
  const e = {
    type, x, y, r:d.r*(o.scale||1),
    hp, maxHp:hp,
    vx:0, vy:d.speed*speedMul*(level.speed||1),
    t:rand(8), score:Math.round(d.score*(o.scoreMul||1)),
    color:d.color, core:d.core,
    behavior:d.behavior||'straight',
    attack:d.attack||null,
    attackCd:d.attackCd||2,
    attackTimer:rnd(0.3, Math.max(0.6, d.attackCd||2)),
    hoverY:d.hoverY||200,
    frq:d.frq||2.6, amp:d.amp||95, blinkTimer:1.6,
    baseX:x, spinAngle:rand(TAU), spinCount:0, chargeTimer:0,
    isSplit:!!o.isSplit, canSplit:!!d.split && !o.isSplit,
    dead:false, flash:0, knock:0,
    chargeFx: 0
  };
  if (type === 'elite') e.vx = Math.random() < 0.5 ? -115 : 115;
  enemies.push(e);
  return e;
}
function spawnFormation(type, mul) {

  const gap = 110 - (n-5)*10;
  const sx = W/2-(n-1)*gap/2+rnd(-30, 30);
  for (let i = 0; i < n; i++) spawnEnemy(type, sx+i*gap, -40-Math.abs(i-2)*26);
}
function spawnFormationV(type, mul) {
  const n = clamp(Math.round(5*(mul||1)), 3, 7);
  const gap = 104 - (n-5)*10;
  const sx = W/2-(n-1)*gap/2+rnd(-30, 30);
  for (let i = 0; i < n; i++) spawnEnemy(type, sx+i*gap, -40-Math.abs(i-2)*58);
}
/* 按本关权重表出兵 */
function spawnRandom() {
  const pool = level.pool;
  const totalW = pool.reduce((s, p) => s+p[1], 0);
  let r = Math.random()*totalW;
  let pick = pool[0][0];
  for (const p of pool) { r -= p[1]; if (r <= 0) { pick = p[0]; break; } }
  const pm = level.packMul || 1;
  if (pick === 'straight') { if (Math.random() < 0.6) spawnFormation('straight', pm); else spawnFormationV('straight', pm); }
  else if (pick === 'sine') { const n = Math.ceil(3*pm); for (let i = 0; i < n; i++) spawnEnemy('sine', rnd(140, W-140), -50-i*100); }
  else if (pick === 'dive') { const n = Math.ceil(3*pm); for (let i = 0; i < n; i++) spawnEnemy('dive', rnd(120, W-120), -50-i*90); }
  else if (pick === 'kamikaze') {
    const n = Math.max(2, Math.round((Math.random() < 0.5 ? 2 : 3)*pm));
    for (let i = 0; i < n; i++) spawnEnemy('kamikaze', rnd(120, W-120), -60-i*70);
  }
  else if (pick === 'weaver') { const n = Math.ceil(3*pm); for (let i = 0; i < n; i++) spawnEnemy('weaver', rnd(120, W-120), -50-i*110); }
  else if (pick === 'turret') spawnEnemy('turret', rnd(160, W-160), -60);
  else if (pick === 'spinner') spawnEnemy('spinner', rnd(140, W-140), -60);
  else if (pick === 'sniper') spawnEnemy('sniper', rnd(140, W-140), -60);
  else if (pick === 'bomber') spawnEnemy('bomber', rnd(160, W-160), -70);
  else if (pick === 'splitter') spawnEnemy('splitter', rnd(160, W-160), -60);
  else if (pick === 'orbiter') spawnEnemy('orbiter', rand(TAU), -60);
  else if (pick === 'phantom') spawnEnemy('phantom', rnd(120, W-120), -60);
  else if (pick === 'guardian') spawnEnemy('guardian', rnd(140, W-140), -90);
}
function spawnElite() {
  spawnEnemy('elite', rnd(160, W-160), -70);
  addFloat(W/2, 260, '⚠ 精英机出现', '#ffb027', 34, true);
  SFX.warn();
}
function updateEnemies(dt) {
  for (let i = enemies.length-1; i >= 0; i--) {
    const e = enemies[i];
    e.t += dt;
    e.flash = Math.max(0, e.flash-dt);
    if (e.chargeFx > 0) e.chargeFx = Math.max(0, e.chargeFx - dt*3);
    if (e.knock > 0) { e.knock = Math.max(0, e.knock-dt*4); e.y -= e.knock*40*dt; }
    switch (e.behavior) {
      case 'straight': e.y += e.vy*dt; break;
      case 'sine': e.y += e.vy*dt; e.x = e.baseX+Math.sin(e.t*e.frq)*e.amp; break;
      case 'dive': e.y += e.vy*dt; e.x += Math.sin(e.t*5.5)*80*dt; break;
      case 'hover':
        if (e.y < e.hoverY) e.y += e.vy*dt;
        else {
          e.x = e.baseX+Math.sin(e.t*1.5)*70;
          if (e.x < 70) e.x = 70;
          if (e.x > W-70) e.x = W-70;
        }
        break;
      case 'patrol':
        if (e.y < 250) e.y += e.vy*dt;
        else {
          e.x += e.vx*dt;
          if (e.x < 110) { e.x = 110; e.vx = Math.abs(e.vx); }
          if (e.x > W-110) { e.x = W-110; e.vx = -Math.abs(e.vx); }
        }
        break;
      case 'charge': {
        e.chargeTimer += dt;
        if (e.chargeTimer < 0.7) e.y += e.vy*0.25*dt;
        else {
          const ang = Math.atan2(player.y-e.y, player.x-e.x);
          const spd = e.vy*2.35;
          e.x += Math.cos(ang)*spd*dt;
          e.y += Math.sin(ang)*spd*dt;
          if (Math.random() < 0.7) {
            addParticle({ type:'spark', x:e.x+rnd(-4,4), y:e.y+rnd(-4,4),
              vx:rnd(-30,30), vy:rnd(-30,30), t:0, life:0.25,
              size:2, color:'#ff5e7a', drag:0.9 });
          }
        }
        break;
      }
      case 'orbit':
        e.spinAngle += dt*1.1;
        e.x = W/2+Math.cos(e.spinAngle)*200;
        e.y = 300+Math.sin(e.spinAngle)*150;
        break;
      case 'blink':
        e.y += e.vy*0.55*dt;
        e.blinkTimer -= dt;
        if (e.blinkTimer <= 0) {
          e.blinkTimer = 1.6;
          spark(e.x, e.y, e.color, 10, 260, 2);
          e.x = rnd(80, W-80);
          spark(e.x, e.y, e.color, 10, 260, 2);
        }
        break;
    }
    if (e.attack) {
      e.attackTimer -= dt;
      // 攻击前 0.2s 蓄力提示
      if (e.attackTimer < 0.2 && e.attackTimer > 0) {
        e.chargeFx = Math.max(e.chargeFx, 0.5);
      }
      if (e.attackTimer <= 0) {
        e.attackTimer = e.attackCd / speedMul;
        doEnemyAttack(e);
      }
    }
    if (e.y > H+100 || e.x < -180 || e.x > W+180) enemies.splice(i, 1);
  }
}

/* 预判玩家移动方向 */
function predictAimAngle(e, predictT) {
  const T = predictT || 0.32;
  let px = player.x, py = player.y;
  if (pointer.active) {
    const vx = (pointer.tx - player.x) * 5;
    const vy = (pointer.ty - player.y) * 5;
    px += vx * T;
    py += vy * T;
    // 限制预判范围
    px = clamp(px, 0, W);
    py = clamp(py, 0, H);
  }
  return Math.atan2(py - e.y, px - e.x);
}

function doEnemyAttack(e) {
  const ang = predictAimAngle(e);
  switch (e.attack) {
    case 'aimedDouble':
      addEBullet(e.x, e.y+10, ang, 380, { type:'aimed' });
      addEBullet(e.x, e.y+10, ang, 310, { type:'aimed' });
      SFX.hit();
      break;
    case 'aimed5': {
      for (let i = -2; i <= 2; i++) {
        addEBullet(e.x, e.y+10, ang+i*0.18, 370, { type:'aimed' });
      }
      spark(e.x, e.y+10, e.color, 6, 140, 1.8);
      SFX.hit();
      break;
    }
    case 'spiral3': {
      e.spinCount++;
      const baseAng = e.spinCount*0.5;
      for (let i = 0; i < 3; i++) {
        addEBullet(e.x, e.y, baseAng+i*TAU/3, 260, { type:'wave', color:e.color });
      }
      break;
    }
    case 'bombDouble':
      addEBullet(e.x-16, e.y+14, Math.PI/2, 190, { type:'bomb', accel:230, r:11 });
      addEBullet(e.x+16, e.y+14, Math.PI/2, 190, { type:'bomb', accel:230, r:11 });
      SFX.hit();
      break;
    case 'ring16': {
      const n = 16;
      for (let i = 0; i < n; i++) {
        addEBullet(e.x, e.y, e.t+i*TAU/n, 300, { type:'ring', color:e.color });
      }
      shockwave(e.x, e.y, 80, e.color, 3, 0.35);
      SFX.hit();
      break;
    }
    case 'elitePattern': {
      for (let i = -2; i <= 2; i++) {
        addEBullet(e.x, e.y+16, ang+i*0.20, 360, { type:'aimed', r:7.5 });
      }
      if (Math.random() < 0.55) {
        const n = 10;
        for (let i = 0; i < n; i++) {
          addEBullet(e.x, e.y+16, e.t+i*TAU/n, 270, { type:'ring', color:'#ffb027' });
        }
      }
      spark(e.x, e.y+16, '#ffb027', 6, 140, 1.8);
      SFX.hit();
      break;
    }
    case 'tripleAimed':
      for (let i = -1; i <= 1; i++) {
        addEBullet(e.x, e.y+8, ang+i*0.16, 400, { type:'aimed' });
      }
      SFX.hit();
      break;
    case 'snipe':
      addEBullet(e.x, e.y+12, ang, 560, { type:'aimed', r:5.5, color:'#ff4d4d' });
      spark(e.x, e.y+12, '#ff4d4d', 8, 200, 2);
      shockwave(e.x, e.y, 60, '#ff4d4d', 3, 0.3);
      SFX.crit();
      break;
    case 'ring8':
      for (let i = 0; i < 8; i++) {
        addEBullet(e.x, e.y, e.t+i*TAU/8, 280, { type:'ring', color:e.color });
      }
      SFX.hit();
      break;
    case 'burst5':
      for (let i = -2; i <= 2; i++) {
        addEBullet(e.x, e.y+10, Math.PI/2+i*0.14, 390, { type:'aimed' });
      }
      SFX.hit();
      break;
  }
}

function destroyEnemy(e) {
  if (e.dead) return;
  e.dead = true;
  kills++;
  score += e.score;
  comboCount++;
  comboTimer = 2.2;
  const isElite = e.type === 'elite';
  if (isElite) {
    bigExplosion(e.x, e.y, e.color, 1.25);
    SFX.bigBoom();
    shake(20);
    slowTimer = 0.14;
    flashScreen(0.16, '#ffb027');
  } else {
    spark(e.x, e.y, '#ffffff', 8, 300, 2);
    spark(e.x, e.y, e.color, 10, 260, 2.2);
    debris(e.x, e.y, e.core, 4, 200, 3.4);
    smoke(e.x, e.y, 2, 12, 'rgba(255,140,70,0.4)');
    shockwave(e.x, e.y, 62, e.color, 3, 0.3);
    SFX.boom();
    shake(4);
  }
  addFloat(e.x, e.y-8, '+'+e.score, isElite?'#ffd166':'#9fe8ff', isElite?38:24, isElite);
  dropLoot(e);
  if (e.canSplit && e.type === 'splitter') {
    for (let k = -1; k <= 1; k += 2) {
      const child = spawnEnemy('splitter', e.x+k*22, e.y, { isSplit:true, scale:0.7, hpMul:0.5, scoreMul:0.5 });
      if (child) { child.y += rnd(-10, 10); spark(child.x, child.y, '#7dffb0', 6, 200, 2); }
    }
    shockwave(e.x, e.y, 90, '#7dffb0', 4, 0.4);
  }
}
function dropLoot(e) {
  if (e.type === 'elite') {
    spawnItem(e.x, e.y, WEAPON_KEYS[Math.floor(Math.random()*WEAPON_KEYS.length)]);
    spawnItem(e.x+34, e.y, BUFF_KEYS[Math.floor(Math.random()*BUFF_KEYS.length)]);
    return;
  }
  if (e.isSplit) return;
  const r = Math.random();
  if (r < 0.13) spawnItem(e.x, e.y, WEAPON_KEYS[Math.floor(Math.random()*WEAPON_KEYS.length)]);
  else if (r < 0.18) spawnItem(e.x, e.y, Math.random() < 0.5 ? 'W' : 'O');
  else if (r < 0.25) spawnItem(e.x, e.y, ['R','C','T'][Math.floor(Math.random()*3)]);
  else if (r < 0.33) spawnItem(e.x, e.y, 'H');
  else if (r < 0.38) spawnItem(e.x, e.y, 'B');
  else if (r < 0.41) spawnItem(e.x, e.y, 'G');
}

/* ============================================================
   Boss
   ============================================================ */
function spawnBoss() {
  const st = BOSS_STYLES[levelIndex] || BOSS_STYLES[0];
  boss = {
    x:W/2, y:-170, r:74,
    hp:level.bossHp, maxHp:level.bossHp,
    vx:level.bossSpeed*speedMul, phase:1,
    entering:true, fireCd:1.6, summonCd:5.5,
    burstCount:0, score:level.bossScore, t:0, flash:0, coreGlow:0,
    style:st, shape:st.shape,
    moves:level.bossMoves, cds:level.bossCds,
    chargeFx: 0,
    subAngle: 0
  };
  addFloat(W/2, 320, st.name, st.main, 40, true);
  shake(14); SFX.warn();
}
function updateBoss(dt) {
  if (!boss) return;
  const b = boss;
  b.t += dt;
  b.flash = Math.max(0, b.flash-dt);
  b.coreGlow = 0.5+Math.sin(b.t*6)*0.5;
  if (b.chargeFx > 0) b.chargeFx = Math.max(0, b.chargeFx - dt*3);
  if (b.entering) { b.y += 175*dt; if (b.y >= 215) { b.y = 215; b.entering = false; } return; }
  b.x += b.vx*dt;
  if (b.x < 135) { b.x = 135; b.vx = Math.abs(b.vx); }
  if (b.x > W-135) { b.x = W-135; b.vx = -Math.abs(b.vx); }

  const ratio = b.hp/b.maxHp;
  const np = ratio > 0.7 ? 1 : (ratio > 0.4 ? 2 : 3);
  if (np !== b.phase) {
    b.phase = np;
    b.fireCd = 0.5;
    b.summonCd = 4.5;
    shake(20); slowTimer = 0.24; SFX.warn(); SFX.bossCharge();
    shockwave(b.x, b.y, 320, b.style.main, 8, 0.6);
    spark(b.x, b.y, b.style.main, 32, 440, 3.2);
    addFloat(b.x, b.y-110, np === 2 ? '第二阶段' : '狂暴模式', b.style.main, 36, true);
    // 阶段切换召唤护卫
    spawnEnemy('straight', b.x-120, b.y+50);
    spawnEnemy('straight', b.x+120, b.y+50);
    if (np === 3) {
      spawnEnemy('sine', b.x, b.y+50);
    }
  }

  b.fireCd -= dt;
  // 攻击前蓄力
  if (b.fireCd < 0.35 && b.fireCd > 0) {
    b.chargeFx = Math.max(b.chargeFx, 0.6);
  }
  if (b.fireCd <= 0) bossFire(b);

  if (b.phase === 1) {
    b.summonCd -= dt;
    if (b.summonCd <= 0) {
      b.summonCd = 5.5;
      spawnEnemy('straight', b.x-95, b.y+50);
      spawnEnemy('straight', b.x+95, b.y+50);
    }
  }
}

/* Boss 弹幕动作库（数据驱动，30 关共用） */
const BOSS_MOVES = {
  fan(b, m) { bossFan(b, m.n, m.spread, m.spd); },
  ring(b, m) { bossRing(b, m.n, m.spd); },
  spiral(b, m) {
    b.subAngle += m.step || 0.5;
    for (let i = 0; i < m.n; i++) {
      addEBullet(b.x, b.y, b.subAngle+i*TAU/m.n, m.spd, { type:'ring', color:b.style.main });
    }
  },
  waves(b, m) {
    for (let i = -1; i <= 1; i++) {
      addEBullet(b.x, b.y+44, Math.PI/2+i*0.5, m.spd*0.8, {
        type:'wave', wave:{amp:70, freq:4}, life:5
      });
    }
  },
  homing(b, m) {
    const ang = predictAimAngle(b, 0.3);
    for (let i = -(m.n-1)/2; i <= (m.n-1)/2; i++) {
      addEBullet(b.x, b.y+34, ang+i*0.16, 300, {
        type:'homing', homing:2.0, homingDelay:0.3, life:5
      });
    }
  },
  cross(b, m) {
    const base = b.t*0.7;
    for (let i = 0; i < m.n; i++) {
      addEBullet(b.x, b.y, base+i*TAU/m.n, m.spd*1.2, { type:'aimed', color:b.style.accent });
    }
  },
  rain(b, m) {
    for (let i = 0; i < m.n; i++) {
      const a = Math.PI/2 + (i-(m.n-1)/2)*(1.7/m.n) + rnd(-0.03, 0.03);
      addEBullet(b.x, b.y+40, a, m.spd*0.95, { type:'normal' });
    }
  },
  burst(b, m) {
    const off = rand(TAU);
    for (let i = 0; i < m.n; i++) {
      addEBullet(b.x, b.y, off+i*TAU/m.n, m.spd*1.25, { type:'ring', color:b.style.main });
    }
    shockwave(b.x, b.y, 140, b.style.main, 5, 0.4);
  }
};
function bossFire(b) {
  const set = (b.moves && b.moves[b.phase-1]) || [];
  for (const m of set) {
    const mv = BOSS_MOVES[m.k];
    if (mv) mv(b, m);
  }
  b.fireCd = (b.cds && b.cds[b.phase-1]) || 1.0;
  SFX.hit();
}
function bossFan(b, count, spread, spd) {
  const base = predictAimAngle(b, 0.28);
  for (let i = 0; i < count; i++) {
    addEBullet(b.x, b.y+44, base+(i-(count-1)/2)*spread, spd, { type:'aimed' });
  }
  spark(b.x, b.y+44, b.style.main, 6, 160, 2);
}
function bossRing(b, count, spd) {
  const off = rand(TAU);
  for (let i = 0; i < count; i++) {
    addEBullet(b.x, b.y, off+i*TAU/count, spd, { type:'ring' });
  }
  shockwave(b.x, b.y, 130, b.style.main, 4, 0.35);
}
function destroyBoss() {
  const b = boss;
  score += b.score;
  addFloat(b.x, b.y, '+'+b.score, '#ffd166', 58, true);
  for (let i = 0; i < 10; i++) {
    const dx = rnd(-80,80), dy = rnd(-70,70);
    setTimeout(() => {
      if (state === State.PLAY || state === State.RESULT) {
        bigExplosion(b.x+dx, b.y+dy, [b.style.main, b.style.accent, '#ffffff'][i%3], 0.9);
      }
    }, i*80);
  }
  bigExplosion(b.x, b.y, b.style.main, 2.2);
  shockwave(b.x, b.y, 750, b.style.accent, 16, 1.0);
  shake(38); slowTimer = 0.6; flashScreen(0.6, b.style.accent); SFX.bigBoom();
  spawnItem(b.x, b.y, 'B');
  spawnItem(Math.random() < 0.5 ? b.x-40 : b.x+40, b.y,
    Math.random() < 0.5 ? WEAPON_KEYS[Math.floor(Math.random()*WEAPON_KEYS.length)] : BUFF_KEYS[Math.floor(Math.random()*BUFF_KEYS.length)]);
  ebullets.length = 0;
  boss = null;
  phase = 'clear';
  clearTimer = 2.2;
  SFX.clear();
}

/* ============================================================
   道具
   ============================================================ */
function spawnItem(x, y, kind) {
  items.push({ x, y, kind, r:21, t:0, vy:128, vx:rnd(-55,55) });
}
function updateItems(dt) {
  const px = player.x, py = player.y;
  for (let i = items.length-1; i >= 0; i--) {
    const it = items[i];
    it.t += dt;
    const dx = px-it.x, dy = py-it.y;
    const d = Math.hypot(dx, dy) || 1;
    const range = player.magnet > 0 ? 440 : 118;
    if (player.alive && d < range) {
      const pull = player.magnet > 0 ? 1000 : 560;
      it.x += dx/d*pull*dt; it.y += dy/d*pull*dt;
    } else {
      it.y += it.vy*dt; it.x += it.vx*dt; it.vx *= 0.975;
    }
    if (it.y > H+50) { items.splice(i, 1); continue; }
    if (player.alive && d < it.r+player.r+10) {
      pickItem(it); items.splice(i, 1);
    }
  }
}
function pickItem(it) {

      } else {

      else { score += 200; addFloat(it.x, it.y, '+200', c, 26); SFX.pick(); }

    case 'orb':
      if (player.orbs < 2) { player.orbs++; addFloat(it.x, it.y-6, '浮游炮 ×'+player.orbs, c, 28, true); spark(player.x, player.y, c, 20, 380, 2.4); SFX.powerup(); }
      else { score += 200; addFloat(it.x, it.y, '+200', c, 26); SFX.pick(); }

    case 'crit':
      if (player.crit < 3) { player.crit++; addFloat(it.x, it.y-6, '暴击 +10%', c, 26, true); SFX.powerup(); }
      else { score += 150; addFloat(it.x, it.y, '+150', c, 26); SFX.pick(); }

    case 'pierce':

/* ============================================================
   碰撞
   ============================================================ */
function circleHit(a, b) {
  const dx = a.x-b.x, dy = a.y-b.y;
  const rr = a.r+b.r;
  return dx*dx+dy*dy <= rr*rr;
}
function checkCollisions() {
  for (const b of bullets) {
    if (b.dead) continue;
    for (const e of enemies) {
      if (e.dead) continue;
      if (b.hit && b.hit.indexOf(e) >= 0) continue;
      if (circleHit(b, e)) {
        if (!b.hit) b.hit = [];
        b.hit.push(e);
        const isCrit = rollCrit();
        e.hp -= b.dmg*(isCrit?2:1);
        e.flash = 0.09; e.knock = 1;
        spark(b.x, b.y, '#ffffff', 3, 180, 1.6);
        spark(b.x, b.y, e.color, 3, 150, 1.4);
        if (isCrit) { addFloat(b.x, b.y-10, 'CRIT', '#ffd166', 22, true); SFX.crit(); }
        const canPierce = player.pierce > 0 || b.pierce > 0;
        if (canPierce) {
          if (b.pierce > 0) b.pierce--;
          else if (player.pierce > 0 && !b.usedPlayerPierce) { b.usedPlayerPierce = true; b.pierce = player.pierce-1; }
        } else b.dead = true;
        if (e.type === 'elite') { hitStop = Math.max(hitStop, 0.018); shake(2); }
        if (e.hp <= 0) destroyEnemy(e);
        if (b.dead) break;
      }
    }
    if (b.dead) continue;
    if (boss && !boss.entering) {
      if (b.hit && b.hit.indexOf(boss) >= 0) continue;
      if (circleHit(b, boss)) {
        if (!b.hit) b.hit = [];
        b.hit.push(boss);
        const isCrit = rollCrit();
        boss.hp -= b.dmg*(isCrit?2:1);
        boss.flash = 0.07;
        spark(b.x, b.y, '#ffffff', 4, 200, 1.8);
        spark(b.x, b.y, boss.style.main, 4, 170, 1.6);
        if (isCrit) addFloat(b.x, b.y-10, 'CRIT', '#ffd166', 22, true);
        hitStop = Math.max(hitStop, 0.022);
        shake(1.6);
        if (player.pierce > 0 && !b.usedPlayerPierce) { b.usedPlayerPierce = true; b.pierce = player.pierce-1; }
        else if (b.pierce > 0) b.pierce--;
        else b.dead = true;
        if (boss && boss.hp <= 0) destroyBoss();
      }
    }
  }

  // 玩家子弹 vs 敌弹（击碎）
  for (const b of bullets) {
    if (b.dead) continue;
    for (let i = ebullets.length-1; i >= 0; i--) {
      const eb = ebullets[i];
      if (eb.dead) continue;
      if (Math.abs(b.x - eb.x) > b.r + eb.r) continue;
      if (Math.abs(b.y - eb.y) > b.r + eb.r) continue;
      if (circleHit(b, eb)) {
        eb.hp -= 1;
        eb.flash = 0.08;
        if (eb.hp <= 0) {
          score += eb.scoreValue;
          shatterBullet(eb);
          ebullets.splice(i, 1);
        } else {
          spark(b.x, b.y, '#ffffff', 2, 150, 1.2);
          spark(b.x, b.y, eb.color, 2, 130, 1.1);
        }
        if (player.pierce > 0 && !b.usedPlayerPierce) { b.usedPlayerPierce = true; b.pierce = player.pierce-1; }
        else if (b.pierce > 0) b.pierce--;
        else b.dead = true;
        if (b.dead) break;
      }
    }
  }

  bullets = bullets.filter(b => !b.dead);
  enemies = enemies.filter(e => !e.dead);

  if (player.alive && player.inv <= 0) {
    for (const e of enemies) {
      if (e.dead) continue;
      if (circleHit(player, e)) { destroyEnemy(e); hurtPlayer(1+(level.contactAdd||0)); break; }
    }
    enemies = enemies.filter(e => !e.dead);
  }
  if (player.alive && player.inv <= 0) {
    for (const b of ebullets) {
      if (b.dead) continue;
      if (circleHit(player, b)) { b.dead = true; hurtPlayer(b.dmg); break; }
    }
    ebullets = ebullets.filter(b => !b.dead);
  }
  if (player.alive && player.inv <= 0 && boss && !boss.entering) {
    if (circleHit(player, boss)) hurtPlayer(2+(level.contactAdd||0));
  }
}

/* ============================================================
   更新主循环
   ============================================================ */
function updateShake(dt) {
  if (shakeAmount > 0) {
    shakeAmount = Math.max(0, shakeAmount-dt*70);
    shakeX = (Math.random()-0.5)*shakeAmount;
    shakeY = (Math.random()-0.5)*shakeAmount;
  } else { shakeX = 0; shakeY = 0; }
}
function updateSpawn(dt) {
  if (phase !== 'wave') return;
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnTimer = level.spawn / speedMul * rnd(0.82, 1.22);
    spawnRandom();
  }
  // 途中定期空投治疗道具
  healTimer -= dt;
  if (healTimer <= 0) {
    healTimer = rnd(9, 13);
    spawnItem(rnd(80, W-80), -40, 'H');
  }
  const times = level.eliteAt;
  for (let i = 0; i < times.length; i++) {
    if (!eliteUsed[i] && levelTimer >= times[i]) { eliteUsed[i] = true; spawnElite(); }
  }
}
function checkPhase(dt) {
  if (phase === 'wave') {
    if (levelTimer >= level.waveTime) { phase = 'warn'; bossWarnTimer = 1.9; SFX.warn(); }
  } else if (phase === 'warn') {
    bossWarnTimer -= dt;
    if (bossWarnTimer <= 0) { spawnBoss(); phase = 'boss'; }
  } else if (phase === 'clear') {
    clearTimer -= dt;
    if (clearTimer <= 0) {
      if (levelIndex+1 < LEVELS.length) {
        const next = levelIndex+1;
        startLevel(next);
        spawnItem(W/2-44, 280, WEAPON_KEYS[Math.floor(Math.random()*WEAPON_KEYS.length)]);
        spawnItem(W/2+44, 280, player.hp < player.maxHp ? 'H' : 'R');
        addFloat(W/2, 420, LEVELS[next].name, '#8ef2ff', 42, true);
        if (LEVELS[next].stage === 0) {
          addFloat(W/2, 480, '「'+WORLDS[LEVELS[next].world]+'」', '#ffd166', 30);
          revivesUsed = 0; // 每局战役复活次数重置
        }
      } else endGame(true);
    }
  }
}
function updatePlay(dt) {
  elapsed += dt;
  levelTimer += dt;
  updateSpeedMul();
  if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) comboCount = 0; }
  if (switchCd > 0) switchCd = Math.max(0, switchCd-dt);
  if (player.alive) updatePlayer(dt);
  if (deathTimer > 0) {
    deathTimer -= dt;
    if (deathTimer <= 0) {
      deathTimer = -1;
      if (revivesUsed < 1) state = State.REVIVE;
      else endGame(false);
      return;
    }
  }
  updateLaser(dt);
  updateBullets(dt);
  updateEnemies(dt);
  updateBoss(dt);
  updateEBullets(dt);
  updateItems(dt);
  updateHelpers(dt);
  updateArcs(dt);
  updateSpawn(dt);
  checkCollisions();
  checkPhase(dt);
}
function updateBullets(dt) {
  for (let i = bullets.length-1; i >= 0; i--) {
    const b = bullets[i];
    if (b.homing) {
      let target = null, minD = Infinity;
      for (const e of enemies) {
        if (e.dead) continue;
        const d = (e.x-b.x)**2+(e.y-b.y)**2;
        if (d < minD) { minD = d; target = e; }
      }
      if (boss && !boss.entering) {
        const d = (boss.x-b.x)**2+(boss.y-b.y)**2;
        if (d < minD) { minD = d; target = boss; }
      }
      if (target) {
        const ang = Math.atan2(target.y-b.y, target.x-b.x);
        const curAng = Math.atan2(b.vy, b.vx);
        let diff = ang-curAng;
        while (diff > Math.PI) diff -= TAU;
        while (diff < -Math.PI) diff += TAU;
        const turn = Math.sign(diff)*Math.min(Math.abs(diff), 6*dt);
        const newAng = curAng+turn;
        const spd = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(newAng)*spd;
        b.vy = Math.sin(newAng)*spd;
      }
    }
    b.x += b.vx*dt; b.y += b.vy*dt;
    if (b.y < -60 || b.x < -70 || b.x > W+70 || b.y > H+60) bullets.splice(i, 1);
  }
}
function update(dt) {
  if (hitStop > 0) { hitStop -= dt; return; }
  gameTime += dt;
  let ts = 1;
  if (slowTimer > 0) { slowTimer -= dt; ts = 0.32; }
  const sdt = dt*ts;
  updateShake(dt);
  updateStars(dt*ts);
  gridOffset += dt*72*speedMul;
  updateParticles(sdt);
  updateWaves(sdt);
  updateFloats(dt);
  if (flash > 0) flash = Math.max(0, flash-dt*2.6);
  if (levelUpFx > 0) levelUpFx = Math.max(0, levelUpFx-dt*1.6);
  if (switchFx > 0) switchFx = Math.max(0, switchFx-dt*1.4);
  if (shipSwitchFx > 0) shipSwitchFx = Math.max(0, shipSwitchFx-dt*1.4);
  if (menuClickFx > 0) menuClickFx = Math.max(0, menuClickFx-dt*1.6);
  if (state === State.PLAY) updatePlay(sdt);
  if (state === State.AD) {
    adTimer -= dt;
    if (adTimer <= 0) { adTimer = -1; doRevive(); }
  }
}

/* ============================================================

function drawShipShape(c, type, scale, t) {
  const s = scale || 1;

  const def = SHIP_DEF[type] || SHIP_DEF.assault;

  const flick = 0.7+Math.sin(t*20)*0.3+Math.random()*0.15;

  c.fillStyle = 'rgba(60,180,255,0.55)';
  if (type === 'tank') {
    c.beginPath(); c.moveTo(-10, 20); c.lineTo(-6, 20+26*flick); c.lineTo(-2, 20); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(2, 20); c.lineTo(6, 20+26*flick); c.lineTo(10, 20); c.closePath(); c.fill();
  } else {
    c.beginPath(); c.moveTo(-7, 20); c.lineTo(0, 20+30*flick); c.lineTo(7, 20); c.closePath(); c.fill();
  }

    c.beginPath(); c.moveTo(-5, 20); c.lineTo(-3, 20+14*flick); c.lineTo(-1, 20); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(1, 20); c.lineTo(3, 20+14*flick); c.lineTo(5, 20); c.closePath(); c.fill();
  } else {
    c.beginPath(); c.moveTo(-4, 20); c.lineTo(0, 20+18*flick); c.lineTo(4, 20); c.closePath(); c.fill();
  }
  c.globalAlpha = 1;
  c.globalCompositeOperation = 'source-over';

  c.fillStyle = '#1a4a75';
  c.strokeStyle = col;
  c.lineWidth = 2;
  if (type === 'tank') {
    c.beginPath(); c.moveTo(-8, -8); c.lineTo(-44, 18); c.lineTo(-38, 28); c.lineTo(-9, 18); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(8, -8); c.lineTo(44, 18); c.lineTo(38, 28); c.lineTo(9, 18); c.closePath(); c.fill(); c.stroke();
  } else if (type === 'speed') {

    c.beginPath(); c.moveTo(5, -6); c.lineTo(30, 22); c.lineTo(24, 26); c.lineTo(6, 16); c.closePath(); c.fill(); c.stroke();
  } else if (type === 'support') {
    c.beginPath(); c.moveTo(-7, -10); c.lineTo(-38, 12); c.lineTo(-30, 24); c.lineTo(-8, 16); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(7, -10); c.lineTo(38, 12); c.lineTo(30, 24); c.lineTo(8, 16); c.closePath(); c.fill(); c.stroke();
  } else {
    c.beginPath(); c.moveTo(-7, -10); c.lineTo(-36, 16); c.lineTo(-31, 24); c.lineTo(-8, 17); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(7, -10); c.lineTo(36, 16); c.lineTo(31, 24); c.lineTo(8, 17); c.closePath(); c.fill(); c.stroke();
  }

  const bodyGrad = c.createLinearGradient(-10, -36, 10, 26);
  if (type === 'tank') { bodyGrad.addColorStop(0,'#ffd9a0'); bodyGrad.addColorStop(0.2,'#d98f3a'); bodyGrad.addColorStop(0.55,'#8a5218'); bodyGrad.addColorStop(1,'#3d2208'); }
  else if (type === 'speed') { bodyGrad.addColorStop(0,'#c8ffe0'); bodyGrad.addColorStop(0.18,'#4add9a'); bodyGrad.addColorStop(0.55,'#1d8055'); bodyGrad.addColorStop(1,'#0a3d28'); }

  else { bodyGrad.addColorStop(0,'#bfefff'); bodyGrad.addColorStop(0.18,'#4aa6dd'); bodyGrad.addColorStop(0.55,'#1d5280'); bodyGrad.addColorStop(1,'#0d2c47'); }

  c.fillStyle = bodyGrad;
  c.strokeStyle = col;
  c.lineWidth = 2.4;

  c.closePath(); c.fill(); c.stroke();

  c.fillStyle = 'rgba(255,255,255,0.5)';

  const cg = c.createLinearGradient(0, -22, 0, -2);

function drawPlayerShip() {
  const p = player;
  if (!p || !p.alive) return;
  if (p.shield > 0) {
    setLight(true);
    for (let i = 0; i < p.shield; i++) {
      const r = 32+i*7+Math.sin(gameTime*6+i*1.3)*2.4;
      ctx.globalAlpha = 0.30;
      ctx.fillStyle = '#7dffb0';
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.fill();
      ctx.globalAlpha = 0.75;
      ctx.strokeStyle = '#a8ffcf';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    setLight(false);
  }
  const blink = p.inv > 0 && Math.floor(gameTime*24)%2 === 0;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.tilt);
  ctx.scale(1-Math.abs(p.bank)*0.12, 1);
  ctx.globalAlpha = blink ? 0.34 : 1;
  drawShipShape(ctx, p.shipType, 1, gameTime);
  ctx.globalAlpha = 1;
  setLight(true);
  glow(0, -4, 20, SHIP_DEF[p.shipType].color, 0.22, 1.7);
  setLight(false);
  ctx.restore();

  // 战机跟随血条
  const bw = 56, bh = 6, bx2 = p.x-bw/2, by2 = p.y+34;
  const ratio = clamp(p.hp/p.maxHp, 0, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  roundRect(bx2-1, by2-1, bw+2, bh+2, 3); ctx.fill();
  const hg = ctx.createLinearGradient(bx2, 0, bx2+bw, 0);
  if (ratio > 0.5) { hg.addColorStop(0, '#7dffb0'); hg.addColorStop(1, '#3ad6ff'); }
  else if (ratio > 0.25) { hg.addColorStop(0, '#ffd166'); hg.addColorStop(1, '#ffb027'); }
  else { hg.addColorStop(0, '#ff8a9c'); hg.addColorStop(1, '#ff2d6a'); }
  ctx.fillStyle = hg;
  roundRect(bx2, by2, Math.max(2, bw*ratio), bh, 3); ctx.fill();
}
function drawHelpers() {

function drawLasers() {
  if (!player || player.weapon !== 'laser' || !player.alive) return;
  const p = player;
  const lv = p.weaponLv;
  const beams = lv;
  const baseW = 10+lv*4;
  const jitter = Math.sin(gameTime*30)*2;
  setLight(true);
  for (let i = 0; i < beams; i++) {
    const off = (i-(beams-1)/2)*30;
    const lx = p.x+off;
    const w = baseW+jitter;
    const grad = ctx.createLinearGradient(lx-w*1.6, 0, lx+w*1.6, 0);
    grad.addColorStop(0, 'rgba(197,139,255,0)');
    grad.addColorStop(0.5, 'rgba(197,139,255,0.85)');
    grad.addColorStop(1, 'rgba(197,139,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(lx-w*1.6, 0, w*3.2, p.y-24);
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.fillRect(lx-w*0.28, 0, w*0.56, p.y-24);

}
function drawArcs() {
  setLight(true);
  for (const a of arcs) {
    const k = a.t/a.life;
    const alpha = 1-k;
    ctx.globalAlpha = alpha;
    for (let pass = 0; pass < 2; pass++) {
      ctx.strokeStyle = pass === 0 ? 'rgba(125,255,176,0.9)' : 'rgba(255,255,255,0.95)';
      ctx.lineWidth = pass === 0 ? 5 : 1.5;
      ctx.beginPath();
      for (let i = 0; i < a.points.length; i++) {
        const pt = a.points[i];
        const jx = pt.x+rnd(-8, 8)*(pass === 0 ? 1 : 0.5);
        const jy = pt.y+rnd(-8, 8)*(pass === 0 ? 1 : 0.5);
        if (i === 0) ctx.moveTo(jx, jy); else ctx.lineTo(jx, jy);
      }
      ctx.stroke();
    }
    for (let i = 1; i < a.points.length; i++) {
      const pt = a.points[i];
      glow(pt.x, pt.y, 14, '#7dffb0', 0.6*alpha, 1.6);
    }
  }
  ctx.globalAlpha = 1;
  setLight(false);
}
function drawBullets() {

    } else {

      else { col = 'rgba(120,200,255,0.85)'; core = '#ffffff'; }

      ctx.globalAlpha = 0.95;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.ellipse(b.x, b.y, w, h, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = core;
      ctx.beginPath(); ctx.ellipse(b.x, b.y-1, w*0.42, h*0.6, 0, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  setLight(false);
}
function drawEBullets() {

      ctx.fillStyle = '#ffb027';

      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();

    } else if (b.type === 'wave') {

      ctx.beginPath(); ctx.arc(b.x, b.y, b.r*2.4, 0, TAU); ctx.fill();

      g.addColorStop(0, '#ffffff'); g.addColorStop(0.45, b.color); g.addColorStop(1, 'rgba(150,80,255,0.2)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    } else if (b.type === 'homing') {
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = '#ff8a3d';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r*2.6, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.4, '#ff8a3d'); g.addColorStop(1, 'rgba(200,80,20,0.25)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#ffd166';

      ctx.globalAlpha = 0.7;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r+4+Math.sin(b.t*12)*2, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (b.type === 'ring') {
      ctx.globalAlpha = 0.22;
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r*2.2, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, b.color); g.addColorStop(1, 'rgba(0,150,200,0.2)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    } else {
      ctx.globalAlpha = 0.24;
      ctx.fillStyle = '#ff2d6a';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r*2.4, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.45, b.color); g.addColorStop(1, 'rgba(255,45,106,0.2)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    }
    if (b.flash > 0) {
      ctx.globalAlpha = Math.min(1, b.flash / 0.08) * 0.85;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.15, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
