<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ModelHub · 开源 AI 模型下载站</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}

  :root{
    --bg:          #0D1117;
    --bg-elevated: #161B22;
    --bg-overlay:  #1C2128;
    --bg-inset:    #010409;

    --border:       #30363D;
    --border-muted: #21262D;

    --text:   #E6EDF3;
    --text-2: #8B949E;
    --text-3: #6E7681;

    --accent:       #2F81F7;
    --accent-hover: #58A6FF;
    --accent-soft:  rgba(47,129,247,.14);

    --green:  #3FB950;
    --orange: #D29922;
    --pink:   #DB61A2;
    --cyan:   #39C5CF;
    --purple: #A371F7;
    --red:    #F85149;

    --radius-sm: 6px;
    --radius:    8px;
    --radius-lg: 12px;
  }

  html{scroll-behavior:smooth}

  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Inter","PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:14px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    min-height:100vh;
  }

  a{color:inherit;text-decoration:none}
  button{font-family:inherit}
  ::selection{background:rgba(47,129,247,.32)}

  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:#30363D;border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#484F58}

  /* ===== 容器放宽 ===== */
  .container{max-width:1560px;margin:0 auto;padding:0 40px}

  /* =====================================================
     HEADER
     ===================================================== */
  header{
    position:sticky;top:0;z-index:60;
    background:rgba(13,17,23,.85);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border-muted);
  }
  .nav{display:flex;align-items:center;gap:24px;height:60px}

  .logo{
    display:flex;align-items:center;gap:9px;
    font-size:15px;font-weight:600;letter-spacing:-.01em;
    flex-shrink:0;color:var(--text);
  }
  .logo-mark{
    width:26px;height:26px;border-radius:6px;
    background:var(--accent);
    display:grid;place-items:center;color:#fff;flex-shrink:0;
  }
  .logo-mark svg{width:15px;height:15px}

  .nav-links{display:flex;gap:4px;font-size:13.5px}
  .nav-links a{
    color:var(--text-2);font-weight:500;
    padding:6px 10px;border-radius:var(--radius-sm);
    transition:color .15s,background .15s;
  }
  .nav-links a:hover{color:var(--text);background:var(--bg-elevated)}
  .nav-links a.on{color:var(--text);font-weight:600}

  .search{flex:1;max-width:440px;margin-left:auto;position:relative}
  .search svg{
    position:absolute;left:11px;top:50%;transform:translateY(-50%);
    width:14px;height:14px;color:var(--text-3);pointer-events:none;
  }
  .search input{
    width:100%;height:34px;
    background:var(--bg-elevated);
    border:1px solid var(--border-muted);
    border-radius:var(--radius);
    color:var(--text);
    padding:0 12px 0 34px;
    font-size:13px;outline:none;
    transition:border-color .15s,background .15s,box-shadow .15s;
  }
  .search input::placeholder{color:var(--text-3)}
  .search input:focus{
    border-color:var(--accent);
    background:var(--bg);
    box-shadow:0 0 0 3px rgba(47,129,247,.15);
  }

  .btn-icon{
    width:34px;height:34px;flex-shrink:0;
    border-radius:var(--radius);
    border:1px solid var(--border-muted);
    background:var(--bg-elevated);
    color:var(--text-2);
    display:grid;place-items:center;
    cursor:pointer;transition:.15s;
  }
  .btn-icon:hover{color:var(--text);border-color:var(--border);background:var(--bg-overlay)}
  .btn-icon svg{width:16px;height:16px}

  /* =====================================================
     HERO
     ===================================================== */
  .hero{padding:56px 0 40px;text-align:center}
  .hero h1{
    font-size:32px;font-weight:700;letter-spacing:-.025em;
    line-height:1.25;color:var(--text);
  }
  .hero p{
    color:var(--text-2);margin-top:14px;font-size:14.5px;
    max-width:600px;margin-left:auto;margin-right:auto;
    line-height:1.65;
  }
  .hero-stats{
    display:flex;justify-content:center;gap:0;
    margin-top:32px;flex-wrap:wrap;
  }
  .hero-stats > div{padding:0 40px;border-right:1px solid var(--border-muted)}
  .hero-stats > div:last-child{border-right:none}
  .hero-stats b{
    display:block;font-size:20px;font-weight:600;
    letter-spacing:-.02em;color:var(--text);
    font-variant-numeric:tabular-nums;
  }
  .hero-stats span{display:block;font-size:12px;color:var(--text-3);margin-top:3px}

  /* =====================================================
     SECTION
     ===================================================== */
  .section{margin-top:52px}
  .section-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
  .section-head h2{
    font-size:16px;font-weight:600;letter-spacing:-.01em;
    display:flex;align-items:center;gap:8px;
  }
  .section-head h2 svg{width:17px;height:17px;color:var(--orange)}
  .section-head .hint{font-size:12.5px;color:var(--text-3);margin-left:auto}

  /* =====================================================
     RANKING
     ===================================================== */
  .rank-panel{
    background:var(--bg-elevated);
    border:1px solid var(--border-muted);
    border-radius:var(--radius-lg);
    overflow:hidden;
  }
  .rank-grid{display:grid;grid-template-columns:1fr 1fr}
  .rank-col + .rank-col{border-left:1px solid var(--border-muted)}

  .rank-item{
    display:flex;align-items:center;gap:12px;
    padding:11px 22px;transition:background .12s;position:relative;
  }
  .rank-item + .rank-item{border-top:1px solid var(--border-muted)}
  .rank-item:hover{background:var(--bg-overlay)}

  .rank-no{
    width:20px;flex-shrink:0;text-align:center;
    font-size:13px;font-weight:600;
    font-variant-numeric:tabular-nums;color:var(--text-3);
  }
  .rank-no.top1{color:#E3B341}
  .rank-no.top2{color:#A9B4C0}
  .rank-no.top3{color:#C69076}

  .rank-icon{
    width:28px;height:28px;border-radius:var(--radius-sm);
    display:grid;place-items:center;flex-shrink:0;
    background:rgba(255,255,255,.04);
    border:1px solid var(--border-muted);
  }
  .rank-icon svg{width:15px;height:15px}

  .rank-info{flex:1;min-width:0}
  .rank-name{
    display:block;font-size:13.5px;font-weight:500;color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .rank-meta{
    display:block;font-size:11.5px;color:var(--text-3);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;
  }
  .rank-num{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .rank-dl{
    font-size:12.5px;color:var(--text-2);
    font-variant-numeric:tabular-nums;font-weight:500;
    min-width:46px;text-align:right;
  }
  .rank-trend{
    font-size:11.5px;font-weight:600;
    font-variant-numeric:tabular-nums;
    min-width:48px;text-align:right;
  }
  .rank-trend.up{color:var(--green)}
  .rank-trend.down{color:var(--text-3)}

  /* =====================================================
     CHIPS
     ===================================================== */
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
  .chip{
    padding:5px 12px;border-radius:20px;
    border:1px solid var(--border-muted);
    background:transparent;
    color:var(--text-2);font-size:13px;font-weight:500;
    cursor:pointer;transition:.15s;
  }
  .chip:hover{color:var(--text);border-color:var(--border);background:var(--bg-elevated)}
  .chip.on{
    background:var(--accent-soft);
    border-color:rgba(47,129,247,.5);
    color:var(--accent-hover);
  }

  /* =====================================================
     MODEL CARD
     ===================================================== */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:18px;
  }

  .card{
    display:flex;flex-direction:column;
    background:var(--bg-elevated);
    border:1px solid var(--border-muted);
    border-radius:var(--radius-lg);
    padding:20px;
    transition:border-color .15s,background .15s,transform .15s;
    cursor:pointer;
  }
  .card:hover{
    border-color:var(--border);background:var(--bg-overlay);
    transform:translateY(-2px);
  }

  .card-top{display:flex;align-items:center;gap:9px;margin-bottom:14px}
  .card-icon{
    width:32px;height:32px;border-radius:var(--radius);
    display:grid;place-items:center;flex-shrink:0;
    background:rgba(255,255,255,.035);
    border:1px solid var(--border-muted);
    color:var(--c);
  }
  .card-icon svg{width:17px;height:17px}
  .card-cat{font-size:12px;font-weight:500;color:var(--text-3);letter-spacing:.01em}
  .card-dl{
    margin-left:auto;font-size:12px;color:var(--text-3);
    font-variant-numeric:tabular-nums;
    display:flex;align-items:center;gap:4px;
  }
  .card-dl svg{width:11px;height:11px;opacity:.8}

  .card h3{
    font-size:15px;font-weight:600;letter-spacing:-.01em;
    line-height:1.35;color:var(--text);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .card-author{font-size:12.5px;color:var(--text-3);margin-top:3px}
  .card-desc{
    font-size:13px;color:var(--text-2);line-height:1.6;margin-top:12px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;min-height:41px;
  }

  .card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
  .tag{
    font-size:11px;font-weight:500;
    padding:2px 7px;border-radius:var(--radius-sm);
    background:rgba(255,255,255,.04);
    color:var(--text-3);
    border:1px solid var(--border-muted);
  }

  .card-foot{
    display:flex;align-items:center;gap:16px;
    margin-top:16px;padding-top:13px;
    border-top:1px solid var(--border-muted);
    font-size:12px;color:var(--text-3);
    font-variant-numeric:tabular-nums;
  }
  .card-foot span{display:flex;align-items:center;gap:5px}
  .card-foot svg{width:12px;height:12px;opacity:.75}
  .card-foot .go{
    margin-left:auto;color:var(--accent);
    font-weight:500;font-size:12.5px;transition:color .15s;
  }
  .card:hover .card-foot .go{color:var(--accent-hover)}

  /* =====================================================
     DETAIL
     ===================================================== */
  .back{
    display:inline-flex;align-items:center;gap:6px;
    margin:28px 0 20px;
    font-size:13px;color:var(--text-2);
    background:none;border:none;cursor:pointer;padding:0;
    transition:color .15s;
  }
  .back:hover{color:var(--text)}
  .back svg{width:14px;height:14px}

  .detail-hero{
    background:var(--bg-elevated);
    border:1px solid var(--border-muted);
    border-radius:var(--radius-lg);
    padding:26px 30px;
    display:flex;gap:20px;align-items:flex-start;
  }
  .hero-icon{
    width:56px;height:56px;border-radius:var(--radius-lg);
    flex-shrink:0;display:grid;place-items:center;
    background:rgba(255,255,255,.04);
    border:1px solid var(--border-muted);
    color:var(--c);
  }
  .hero-icon svg{width:28px;height:28px}

  .hero-main{flex:1;min-width:0}
  .hero-main h1{
    font-size:23px;font-weight:700;letter-spacing:-.02em;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;line-height:1.3;
  }
  .hero-badge{
    font-size:11.5px;font-weight:600;
    padding:3px 9px;border-radius:20px;
    color:var(--c);
    background:rgba(255,255,255,.045);
    border:1px solid var(--border-muted);
  }
  .hero-sub{color:var(--text-3);font-size:13px;margin-top:8px}
  .hero-sub b{color:var(--text-2);font-weight:500}
  .hero-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}

  .hero-actions{display:flex;flex-direction:column;gap:8px;flex-shrink:0}
  .btn{
    border:none;border-radius:var(--radius);
    font-size:13.5px;font-weight:600;
    cursor:pointer;transition:.15s;
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:0 18px;height:38px;white-space:nowrap;
  }
  .btn svg{width:15px;height:15px}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-hover)}
  .btn-primary:active{transform:scale(.98)}
  .btn-ghost{
    background:var(--bg);border:1px solid var(--border);color:var(--text-2);
  }
  .btn-ghost:hover{border-color:#484F58;color:var(--text);background:var(--bg-overlay)}

  .stat-strip{
    display:grid;grid-template-columns:repeat(4,1fr);
    margin-top:16px;
    background:var(--bg-elevated);
    border:1px solid var(--border-muted);
    border-radius:var(--radius-lg);
    overflow:hidden;
  }
  .stat{padding:16px 24px}
  .stat + .stat{border-left:1px solid var(--border-muted)}
  .stat span{font-size:11.5px;color:var(--text-3);display:block;letter-spacing:.01em}
  .stat b{
    font-size:17px;font-weight:600;letter-spacing:-.02em;
    display:block;margin-top:5px;
    font-variant-numeric:tabular-nums;color:var(--text);
  }

  .tabs{
    display:flex;gap:2px;margin-top:28px;
    border-bottom:1px solid var(--border-muted);
    overflow-x:auto;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    padding:11px 16px;font-size:13.5px;font-weight:500;
    color:var(--text-2);background:none;border:none;
    border-bottom:2px solid transparent;
    cursor:pointer;transition:.15s;
    white-space:nowrap;margin-bottom:-1px;
  }
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--text);border-bottom-color:var(--accent);font-weight:600}

  .panel{padding:28px 0 64px;animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .panel h4{
    font-size:14px;font-weight:600;letter-spacing:-.01em;
    margin:0 0 14px;color:var(--text);
    display:flex;align-items:center;gap:8px;
  }
  .panel h4::before{
    content:"";width:3px;height:14px;border-radius:2px;
    background:var(--accent);flex-shrink:0;
  }
  .panel h4:not(:first-child){margin-top:32px}

  .body-text{color:var(--text-2);font-size:13.5px;line-height:1.85}

  .highlight-list{list-style:none;display:grid;gap:8px}
  .highlight-list li{
    display:flex;gap:10px;font-size:13.5px;color:var(--text-2);
    background:var(--bg-elevated);
    border:1px solid var(--border-muted);
    border-radius:var(--radius);
    padding:11px 15px;line-height:1.6;
  }
  .highlight-list li::before{
    content:"";width:5px;height:5px;border-radius:50%;
    background:var(--accent);flex-shrink:0;margin-top:8px;
  }

  .tbl-wrap{
    border:1px solid var(--border-muted);
    border-radius:var(--radius-lg);
    overflow:hidden;
    background:var(--bg-elevated);
    overflow-x:auto;
  }
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
  thead th{
    text-align:left;padding:11px 20px;
    font-size:11.5px;font-weight:600;
    color:var(--text-3);letter-spacing:.03em;text-transform:uppercase;
    background:var(--bg-inset);
    border-bottom:1px solid var(--border-muted);
    white-space:nowrap;
  }
  tbody td{
    padding:12px 20px;
    border-bottom:1px solid var(--border-muted);
    color:var(--text-2);vertical-align:middle;
  }
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:rgba(255,255,255,.02)}
  tbody td:first-child{color:var(--text);font-weight:500}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px;color:var(--text-2)}
  .stars{white-space:nowrap;font-size:12.5px;letter-spacing:1px;color:var(--orange)}
  .stars i{color:#30363D;font-style:normal}

  .pill{
    font-size:11.5px;padding:2px 8px;border-radius:20px;
    font-weight:500;display:inline-block;white-space:nowrap;
  }
  .pill-blue{color:var(--accent-hover);background:var(--accent-soft)}

  .bench-grid{display:grid;gap:14px}
  .bench{display:grid;grid-template-columns:170px 1fr 56px;align-items:center;gap:16px;font-size:12.5px}
  .bench-label{color:var(--text-2)}
  .bar{height:6px;border-radius:3px;background:var(--bg-inset);overflow:hidden}
  .bar i{
    display:block;height:100%;border-radius:3px;
    background:linear-gradient(90deg,#2F81F7,#39C5CF);
    transition:width .6s cubic-bezier(.2,.8,.2,1);
  }
  .bench-val{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text)}

  .file-list{display:grid;gap:8px}
  .file-row{
    display:flex;align-items:center;gap:14px;
    padding:12px 20px;
    background:var(--bg-elevated);
    border:1px solid var(--border-muted);
    border-radius:var(--radius);
    transition:border-color .15s,background .15s;
  }
  .file-row:hover{border-color:var(--border);background:var(--bg-overlay)}
  .file-row > svg{width:16px;height:16px;color:var(--text-3);flex-shrink:0}
  .file-name{
    flex:1;font-size:12.5px;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .file-size{font-size:12.5px;color:var(--text-3);font-variant-numeric:tabular-nums;flex-shrink:0}
  .file-btn{
    font-size:12.5px;font-weight:500;
    padding:5px 14px;border-radius:var(--radius-sm);
    background:transparent;color:var(--text-2);
    border:1px solid var(--border);
    cursor:pointer;transition:.15s;flex-shrink:0;
  }
  .file-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}

  /* =====================================================
     AI NAVIGATION PAGE
     ===================================================== */
  .nav-hero{padding:48px 0 34px;text-align:center}
  .nav-hero h1{
    font-size:28px;font-weight:700;letter-spacing:-.025em;line-height:1.3;
  }
  .nav-hero p{
    color:var(--text-2);margin-top:12px;font-size:14px;
    max-width:660px;margin-left:auto;margin-right:auto;line-height:1.7;
  }
  .nav-search{
    max-width:560px;margin:24px auto 0;position:relative;
  }
  .nav-search svg{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:15px;height:15px;color:var(--text-3);pointer-events:none;
  }
  .nav-search input{
    width:100%;height:42px;
    background:var(--bg-elevated);
    border:1px solid var(--border-muted);
    border-radius:var(--radius);
    color:var(--text);
    padding:0 16px 0 40px;
    font-size:13.5px;outline:none;
    transition:border-color .15s,background .15s,box-shadow .15s;
  }
  .nav-search input::placeholder{color:var(--text-3)}
  .nav-search input:focus{
    border-color:var(--accent);background:var(--bg);
    box-shadow:0 0 0 3px rgba(47,129,247,.15);
  }

  .nav-layout{
    display:grid;grid-template-columns:220px 1fr;
    gap:32px;align-items:start;padding-bottom:64px;
  }

  .nav-side{
    position:sticky;top:84px;
    background:var(--bg-elevated);
    border:1px solid var(--border-muted);
    border-radius:var(--radius-lg);
    padding:8px;
  }
  .side-title{
    font-size:11px;font-weight:600;color:var(--text-3);
    text-transform:uppercase;letter-spacing:.05em;
    padding:9px 10px 7px;
  }
  .side-item{
    width:100%;display:flex;align-items:center;gap:10px;
    padding:8px 10px;border-radius:var(--radius-sm);
    background:none;border:none;cursor:pointer;
    color:var(--text-2);font-size:13px;font-weight:500;
    transition:.15s;text-align:left;
  }
  .side-item:hover{background:var(--bg-overlay);color:var(--text)}
  .side-item.on{background:var(--accent-soft);color:var(--accent-hover)}
  .side-item svg{width:15px;height:15px;flex-shrink:0;opacity:.9}
  .side-item em{
    margin-left:auto;font-style:normal;font-size:11.5px;
    color:var(--text-3);font-variant-numeric:tabular-nums;
  }
  .side-item.on em{color:var(--accent-hover)}

  .nav-content-head{
    display:flex;align-items:baseline;gap:12px;margin-bottom:16px;

/* =========================================================
   工具函数
   ========================================================= */
function fmt(n){
  if(n >= 1e6) return (n/1e6).toFixed(2) + 'M';
  if(n >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return String(n);
}
function starsHtml(str){
  let out = '';
  for(const ch of str){
    out += ch === '★' ? '<span>★</span>' : '<i>★</i>';
  }
  return `<span class="stars">${out}</span>`;
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* =========================================================
   模型列表页

let activeCat = 'all';

function renderRank(){
  const top = [...MODELS].sort((a,b)=>b.dl-a.dl).slice(0,10);
  const half = Math.ceil(top.length/2);
  const cols = [top.slice(0,half), top.slice(half)];

  rankGrid.innerHTML = cols.map((col, ci)=>{
    const offset = ci * half;
    return `<div class="rank-col">` + col.map((m,i)=>{
      const idx = offset + i;
      const c = CATS[m.cat];
      const topCls = idx===0?'top1':idx===1?'top2':idx===2?'top3':'';
      const trendCls = m.trend >= 0 ? 'up' : 'down';
      const sign = m.trend >= 0 ? '+' : '−';
      return `
        <a class="rank-item" href="#/model/${m.id}">
          <span class="rank-no ${topCls}">${idx+1}</span>
          <span class="rank-icon" style="color:${c.color}">${catIcon(m.cat)}</span>
          <span class="rank-info">
            <span class="rank-name">${m.name}</span>
            <span class="rank-meta">${m.author} · ${c.label}</span>
          </span>
          <span class="rank-num">
            <span class="rank-dl">${fmt(m.dl)}</span>
            <span class="rank-trend ${trendCls}">${sign}${Math.abs(m.trend).toFixed(1)}%</span>
          </span>
        </a>`;
    }).join('') + `</div>`;
  }).join('');
}

function renderChips(){
  const items = [['all','全部模型'], ...Object.entries(CATS).map(([k,v])=>[k,v.label])];
  chipsEl.innerHTML = items.map(([k,label])=>
    `<button class="chip ${k===activeCat?'on':''}" data-cat="${k}">${label}</button>`
  ).join('');
  chipsEl.querySelectorAll('.chip').forEach(btn=>{
    btn.onclick = ()=>{
      activeCat = btn.dataset.cat;
      renderChips();
      renderGrid();
    };
  });
}

              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>

/* =========================================================
   AI 导航页
   ========================================================= */
let navCat = 'all';
let navQuery = '';

function renderNavSide(){
  const entries = Object.entries(NAV_CATS);
  navSide.innerHTML = `<div class="side-title">分类导航</div>` + entries.map(([k,v])=>{
    const count = k === 'all' ? NAV_SITES.length : NAV_SITES.filter(s=>s.cat === k).length;
    return `<button class="side-item ${k===navCat?'on':''}" data-cat="${k}">
      ${navCatIcon(k)}
      <span>${v.label}</span>
      <em>${count}</em>
    </button>`;
  }).join('');

  navSide.querySelectorAll('.side-item').forEach(btn=>{
    btn.onclick = ()=>{
      navCat = btn.dataset.cat;
      renderNavSide();
      renderNavSites();
    };
  });
}

function renderNavSites(){
  const q = navQuery.trim().toLowerCase();
  const list = NAV_SITES.filter(s=>{
    const catOk = navCat === 'all' || s.cat === navCat;
    const qOk = !q
      || s.name.toLowerCase().includes(q)
      || s.domain.toLowerCase().includes(q)
      || s.desc.toLowerCase().includes(q)
      || s.tags.some(t=>t.toLowerCase().includes(q));
    return catOk && qOk;
  });

  navCatTitle.textContent = NAV_CATS[navCat].label;
  navCount.textContent = `共 ${list.length} 个站点`;

  if(!list.length){
    siteGrid.innerHTML = `<div class="empty">没有找到匹配的网站，换个关键词试试</div>`;
    return;
  }

  siteGrid.innerHTML = list.map(s=>`
    <a class="site-card" href="https://${s.domain}" target="_blank" rel="noopener noreferrer">
      <div class="site-top">
        <span class="site-logo" style="--lc:${s.color}">${s.name[0]}</span>
        <div class="site-id">
          <span class="site-name">${s.name}${s.hot ? '<em class="hot-tag">热门</em>' : ''}</span>
          <span class="site-domain">${s.domain}</span>
        </div>
        <svg class="site-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 17L17 7M7 7h10v10"/>
        </svg>
      </div>
      <p class="site-desc">${s.desc}</p>
      <div class="site-tags">${s.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    </a>
  `).join('');
}

navSearchInput.addEventListener('input', e=>{
  navQuery = e.target.value;
  renderNavSites();
});

/* =========================================================
   视图切换
   ========================================================= */
function showList(){
  listView.hidden = false;
  detailView.hidden = true;
  navView.hidden = true;
}
function showNav(){
  listView.hidden = true;
  detailView.hidden = true;
  navView.hidden = false;
  window.scrollTo(0,0);
}

function updateNavLinks(route){
  document.querySelectorAll('.nav-links a[data-route]').forEach(a=>{
    a.classList.toggle('on', a.dataset.route === route);
  });
}

/* =========================================================
   路由
   ========================================================= */
function route(){
  const hash = location.hash;
  if(hash.startsWith('#/model/')){
    showDetail(hash.replace('#/model/',''));
    updateNavLinks('home');
  }else if(hash.startsWith('#/nav')){
    showNav();
    updateNavLinks('nav');
  }else{
    showList();
    updateNavLinks('home');
  }
}
window.addEventListener('hashchange', route);

/* =========================================================
   初始化
   ========================================================= */
renderRank();
renderChips();
renderGrid();

renderNavSide();
renderNavSites();

route();
</script>
